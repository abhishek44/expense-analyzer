<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
    <title>Analytics — Expense Tracker</title>
    <meta name="description" content="Analyze your spending patterns, category breakdowns, and account activity" />

    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-dark": "#101922",
                        "surface-dark": "#1c232d",
                        "surface-dark-2": "#232d3a",
                        "border-dark": "#2a3441",
                        "text-secondary": "#9dabb9"
                    },
                    fontFamily: { "display": ["Manrope", "sans-serif"] },
                },
            },
        }
    </script>
    <style>
        body { min-height: 100dvh; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .cat-dropdown { position: relative; }
        .cat-dropdown-menu {
            display: none; position: absolute; top: 100%; left: 0; right: 0;
            z-index: 50; max-height: 240px; overflow-y: auto;
            background: #1c232d; border: 1px solid #2a3441; border-radius: 8px;
            margin-top: 4px; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .cat-dropdown-menu.open { display: block; }
        .cat-dropdown-menu label {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 12px; cursor: pointer; font-size: 13px;
            transition: background 0.15s;
        }
        .cat-dropdown-menu label:hover { background: #232d3a; }
        .chart-card {
            background: linear-gradient(145deg, #1c232d, #1e2835);
            border: 1px solid #2a3441; border-radius: 12px; padding: 20px;
        }
        /* Pivot table */
        .pivot-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .pivot-table th { text-align: right; padding: 8px 12px; font-weight: 600; font-size: 11px;
            text-transform: uppercase; letter-spacing: 0.05em; color: #9dabb9; border-bottom: 2px solid #2a3441; }
        .pivot-table th:first-child { text-align: left; }
        .pivot-table td { padding: 6px 12px; border-bottom: 1px solid #2a344180; }
        .pivot-table td:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; }
        .pivot-l1 { cursor: pointer; transition: background 0.15s; }
        .pivot-l1:hover { background: #232d3a; }
        .pivot-l1 td { font-weight: 700; }
        .pivot-l2 td { padding-left: 32px !important; font-weight: 400; color: #c5d0db; }
        .pivot-l2 { background: #161e28; }
        .pivot-l2:hover { background: #1a2430; }
        .pivot-grand td { font-weight: 800; border-top: 2px solid #2a3441; border-bottom: none;
            padding-top: 10px; padding-bottom: 10px; }
        .pivot-hidden { display: none; }
    </style>
</head>

<body class="bg-background-dark text-white font-display">
    <div id="app" class="min-h-screen flex flex-col max-w-6xl mx-auto"></div>

    <script>
        const API = '/api/analytics/dashboard';

        Chart.defaults.color = '#9dabb9';
        Chart.defaults.borderColor = '#2a3441';
        Chart.defaults.font.family = 'Manrope, sans-serif';

        const CHART_COLORS = [
            '#137fec', '#22c55e', '#ef4444', '#eab308', '#a855f7',
            '#ec4899', '#06b6d4', '#f97316', '#84cc16', '#6366f1',
            '#14b8a6', '#f43f5e', '#8b5cf6', '#10b981', '#f59e0b'
        ];

        let charts = {};
        let filterMeta = null;

        const state = {
            dateFrom: null,
            dateTo: null,
            accountType: null,
            categories: [],
        };

        // ── Utility ──────────────────────────────────────────────────────────
        function esc(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
        function fmt(n) {
            return '\u20B9' + Math.abs(n).toLocaleString('en-IN', { maximumFractionDigits: 0 });
        }
        function fmtMonth(m) {
            const [y, mo] = m.split('-');
            const names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            return names[parseInt(mo) - 1] + ' ' + y.slice(2);
        }
        function destroyCharts() {
            Object.values(charts).forEach(c => c.destroy());
            charts = {};
        }

        // ── Render Shell ─────────────────────────────────────────────────────
        function renderShell() {
            document.getElementById('app').innerHTML = `
                <header class="flex items-center gap-3 p-4 border-b border-border-dark">
                    <a href="/" class="p-2 -ml-2 rounded-full hover:bg-surface-dark transition-colors">
                        <span class="material-symbols-outlined">arrow_back</span>
                    </a>
                    <h1 class="text-xl font-bold">Analytics</h1>
                </header>

                <div id="filterBar" class="p-4 border-b border-border-dark space-y-3">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <p class="text-xs text-text-secondary font-medium uppercase tracking-wide">Filters</p>
                            <button onclick="resetAllFilters()" id="resetFiltersBtn"
                                class="hidden h-6 px-2.5 rounded-full text-xs font-semibold bg-surface-dark border border-border-dark text-text-secondary hover:text-white hover:border-primary/50 transition-all flex items-center gap-1">
                                <span class="material-symbols-outlined text-xs">restart_alt</span>Reset
                            </button>
                        </div>
                        <div id="fyButtons" class="flex gap-1.5 flex-wrap"></div>
                    </div>
                    <div class="flex flex-wrap gap-3 items-end">
                        <div class="flex-1 min-w-[140px]">
                            <label class="text-xs text-text-secondary block mb-1">From</label>
                            <select id="filterDateFrom" onchange="onFilterChange()"
                                class="w-full h-9 px-3 rounded-lg bg-surface-dark border border-border-dark text-sm"></select>
                        </div>
                        <div class="flex-1 min-w-[140px]">
                            <label class="text-xs text-text-secondary block mb-1">To</label>
                            <select id="filterDateTo" onchange="onFilterChange()"
                                class="w-full h-9 px-3 rounded-lg bg-surface-dark border border-border-dark text-sm"></select>
                        </div>
                        <div class="flex-1 min-w-[180px]">
                            <label class="text-xs text-text-secondary block mb-1">Account</label>
                            <div class="flex h-9 rounded-lg overflow-hidden border border-border-dark">
                                <button onclick="setAccountType(null)" id="accAll"
                                    class="acc-btn flex-1 text-sm font-semibold px-3 transition-colors">All</button>
                                <button onclick="setAccountType('Savings')" id="accSavings"
                                    class="acc-btn flex-1 text-sm font-semibold px-3 border-x border-border-dark transition-colors">Savings</button>
                                <button onclick="setAccountType('CreditCard')" id="accCC"
                                    class="acc-btn flex-1 text-sm font-semibold px-3 transition-colors">Credit Card</button>
                            </div>
                        </div>
                        <div class="flex-1 min-w-[180px] cat-dropdown">
                            <label class="text-xs text-text-secondary block mb-1">Categories</label>
                            <button onclick="toggleCatDropdown()" id="catDropdownBtn"
                                class="w-full h-9 px-3 rounded-lg bg-surface-dark border border-border-dark text-sm text-left flex items-center justify-between">
                                <span id="catDropdownLabel" class="truncate">All</span>
                                <span class="material-symbols-outlined text-base">expand_more</span>
                            </button>
                            <div id="catDropdownMenu" class="cat-dropdown-menu"></div>
                        </div>
                    </div>
                </div>

                <main id="dashboardContent" class="flex-1 p-4 space-y-4">
                    <div class="flex justify-center py-16">
                        <div class="w-8 h-8 border-2 border-primary/30 border-t-primary rounded-full animate-spin"></div>
                    </div>
                </main>
            `;
        }

        // ── Filter Logic ─────────────────────────────────────────────────────
        function populateFilters(meta) {
            filterMeta = meta;
            const years = meta.available_years;
            const months = [];
            const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            for (const y of years.sort()) {
                for (let m = 1; m <= 12; m++) {
                    months.push({ value: `${y}-${String(m).padStart(2,'0')}`, label: `${monthNames[m-1]} ${y}` });
                }
            }

            const fromSel = document.getElementById('filterDateFrom');
            const toSel = document.getElementById('filterDateTo');
            fromSel.innerHTML = '<option value="">Earliest</option>' + months.map(m =>
                `<option value="${m.value}">${m.label}</option>`).join('');
            toSel.innerHTML = '<option value="">Latest</option>' + months.slice().reverse().map(m =>
                `<option value="${m.value}">${m.label}</option>`).join('');

            if (state.dateFrom) fromSel.value = state.dateFrom;
            if (state.dateTo) toSel.value = state.dateTo;

            // FY buttons
            const fyContainer = document.getElementById('fyButtons');
            if (meta.fy_options && meta.fy_options.length) {
                fyContainer.innerHTML = meta.fy_options.map(fy => {
                    const isActive = state.dateFrom === fy.date_from && state.dateTo === fy.date_to;
                    return `<button onclick="setFY('${fy.date_from}','${fy.date_to}')"
                        class="h-7 px-3 rounded-full text-xs font-bold transition-all
                        ${isActive ? 'bg-primary text-white' : 'bg-surface-dark border border-border-dark text-text-secondary hover:text-white'}"
                    >${fy.label}</button>`;
                }).join('');
            }

            // Category dropdown
            const menu = document.getElementById('catDropdownMenu');
            menu.innerHTML = `
                <div class="flex items-center justify-between px-3 py-2 border-b border-border-dark">
                    <button onclick="selectAllCategories()" class="text-xs text-primary font-semibold hover:underline">Select All</button>
                    <button onclick="clearAllCategories()" class="text-xs text-text-secondary font-semibold hover:text-white hover:underline">Clear All</button>
                </div>
            ` + meta.available_categories.map(c => `
                <label>
                    <input type="checkbox" class="cat-checkbox rounded border-border-dark bg-surface-dark text-primary"
                        value="${c.name}" ${state.categories.includes(c.name) ? 'checked' : ''}
                        onchange="onCategoryChange()">
                    <span>${c.name}</span>
                </label>
            `).join('');

            updateAccountTypeUI();
            updateCatLabel();
            updateResetBtnVisibility();
        }

        function setFY(from, to) {
            state.dateFrom = from;
            state.dateTo = to;
            document.getElementById('filterDateFrom').value = from;
            document.getElementById('filterDateTo').value = to;
            loadDashboard();
        }

        function setAccountType(type) {
            state.accountType = type;
            updateAccountTypeUI();
            onFilterChange();
        }

        function updateAccountTypeUI() {
            document.querySelectorAll('.acc-btn').forEach(btn => {
                btn.classList.remove('bg-primary', 'text-white');
                btn.classList.add('bg-surface-dark', 'text-text-secondary');
            });
            const activeId = state.accountType === 'Savings' ? 'accSavings' : state.accountType === 'CreditCard' ? 'accCC' : 'accAll';
            const active = document.getElementById(activeId);
            active.classList.add('bg-primary', 'text-white');
            active.classList.remove('bg-surface-dark', 'text-text-secondary');
        }

        function toggleCatDropdown() {
            document.getElementById('catDropdownMenu').classList.toggle('open');
        }

        function onCategoryChange() {
            state.categories = [...document.querySelectorAll('.cat-checkbox:checked')].map(cb => cb.value);
            updateCatLabel();
            onFilterChange();
        }

        function selectAllCategories() {
            document.querySelectorAll('.cat-checkbox').forEach(cb => cb.checked = true);
            onCategoryChange();
        }

        function clearAllCategories() {
            document.querySelectorAll('.cat-checkbox').forEach(cb => cb.checked = false);
            onCategoryChange();
        }

        function resetAllFilters() {
            state.dateFrom = null;
            state.dateTo = null;
            state.accountType = null;
            state.categories = [];
            document.getElementById('filterDateFrom').value = '';
            document.getElementById('filterDateTo').value = '';
            document.querySelectorAll('.cat-checkbox').forEach(cb => cb.checked = false);
            updateAccountTypeUI();
            updateCatLabel();
            updateResetBtnVisibility();
            loadDashboard();
        }

        function updateResetBtnVisibility() {
            const btn = document.getElementById('resetFiltersBtn');
            if (!btn) return;
            const hasFilters = state.dateFrom || state.dateTo || state.accountType || state.categories.length > 0;
            btn.classList.toggle('hidden', !hasFilters);
            btn.classList.toggle('flex', hasFilters);
        }

        function updateCatLabel() {
            const label = document.getElementById('catDropdownLabel');
            if (state.categories.length === 0) label.textContent = 'All';
            else if (state.categories.length <= 2) label.textContent = state.categories.join(', ');
            else label.textContent = `${state.categories.length} selected`;
        }

        function onFilterChange() {
            state.dateFrom = document.getElementById('filterDateFrom').value || null;
            state.dateTo = document.getElementById('filterDateTo').value || null;
            updateResetBtnVisibility();
            loadDashboard();
        }

        document.addEventListener('click', e => {
            if (!e.target.closest('.cat-dropdown')) {
                document.getElementById('catDropdownMenu')?.classList.remove('open');
            }
        });

        // ── Load Data ────────────────────────────────────────────────────────
        async function loadDashboard() {
            const content = document.getElementById('dashboardContent');
            content.innerHTML = '<div class="flex justify-center py-16"><div class="w-8 h-8 border-2 border-primary/30 border-t-primary rounded-full animate-spin"></div></div>';

            let url = API + '?';
            if (state.dateFrom) url += `date_from=${state.dateFrom}&`;
            if (state.dateTo) url += `date_to=${state.dateTo}&`;
            if (state.accountType) url += `account_type=${state.accountType}&`;
            if (state.categories.length) url += `categories=${state.categories.join(',')}&`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                populateFilters(data.filters);
                destroyCharts();
                renderDashboard(content, data);
            } catch (e) {
                content.innerHTML = `<div class="text-center py-16 text-red-400"><p class="font-bold">Failed to load</p><p class="text-sm mt-1">${e.message}</p></div>`;
            }
        }

        // ── Render Dashboard ─────────────────────────────────────────────────
        function renderDashboard(container, data) {
            const { kpi, monthly_trend, category_distribution, l2_distribution, cc_reconciliation, account_types, pivot_table, pivot_grand_total } = data;

            container.innerHTML = `
                <!-- KPI Cards -->
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
                    <div class="chart-card bg-emerald-950/20 border-emerald-900/30">
                        <p class="text-xs text-text-secondary font-medium mb-1">Total Income</p>
                        <p class="text-2xl font-extrabold text-green-400">${fmt(kpi.true_income)}</p>
                        <p class="text-xs text-text-secondary mt-1">Only L1 category = Income</p>
                    </div>
                    <div class="chart-card bg-rose-950/20 border-rose-900/30">
                        <p class="text-xs text-text-secondary font-medium mb-1">Total Expense</p>
                        <p class="text-2xl font-extrabold text-red-400">${fmt(kpi.true_expenses)}</p>
                        <p class="text-xs text-text-secondary mt-1">All categories except Income</p>
                    </div>
                    <div class="chart-card bg-blue-950/20 border-blue-900/30">
                        <p class="text-xs text-text-secondary font-medium mb-1">Net Savings</p>
                        <p class="text-2xl font-extrabold ${kpi.net_savings >= 0 ? 'text-green-400' : 'text-red-400'}">${kpi.net_savings >= 0 ? '' : '-'}${fmt(kpi.net_savings)}</p>
                        <p class="text-xs text-text-secondary mt-1">Income - Expense</p>
                    </div>
                    <div class="chart-card bg-blue-950/20 border-blue-900/30">
                        <p class="text-xs text-text-secondary font-medium mb-1">Savings Rate</p>
                        <p class="text-2xl font-extrabold ${kpi.savings_rate >= 0 ? 'text-green-400' : 'text-red-400'}">${kpi.savings_rate.toFixed(2)}%</p>
                        <p class="text-xs text-text-secondary mt-1">Net Savings / Income</p>
                    </div>
                </div>

                <!-- CC Reconciliation -->
                <div class="chart-card">
                    <div class="flex items-center gap-2 mb-3">
                        <span class="material-symbols-outlined text-lg ${cc_reconciliation.status === 'balanced' ? 'text-green-400' : 'text-yellow-400'}">
                            ${cc_reconciliation.status === 'balanced' ? 'check_circle' : 'warning'}
                        </span>
                        <h3 class="font-bold">CC Bill Reconciliation</h3>
                        <span class="text-xs px-2 py-0.5 rounded-full font-semibold ${cc_reconciliation.status === 'balanced' ? 'bg-green-900/30 text-green-400' : 'bg-yellow-900/30 text-yellow-400'}">
                            ${cc_reconciliation.status === 'balanced' ? 'Balanced' : 'Unbalanced'}
                        </span>
                    </div>
                    <div class="grid grid-cols-3 gap-4 text-center">
                        <div>
                            <p class="text-xs text-text-secondary mb-1">Paid (Debits)</p>
                            <p class="text-lg font-bold text-red-400">${fmt(cc_reconciliation.total_debits)}</p>
                        </div>
                        <div>
                            <p class="text-xs text-text-secondary mb-1">Received (Credits)</p>
                            <p class="text-lg font-bold text-green-400">${fmt(cc_reconciliation.total_credits)}</p>
                        </div>
                        <div>
                            <p class="text-xs text-text-secondary mb-1">Difference</p>
                            <p class="text-lg font-bold ${Math.abs(cc_reconciliation.difference) < 1 ? 'text-green-400' : 'text-yellow-400'}">
                                ${cc_reconciliation.difference >= 0 ? '+' : '-'}${fmt(cc_reconciliation.difference)}
                            </p>
                        </div>
                    </div>
                    ${Math.abs(cc_reconciliation.difference) >= 1 ? `
                    <p class="text-xs text-yellow-400/80 mt-3 flex items-center gap-1">
                        <span class="material-symbols-outlined text-sm">info</span>
                        Non-zero difference may indicate transactions not recorded on one side
                    </p>` : ''}
                </div>

                <!-- Pivot Table -->
                <div class="chart-card">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="font-bold">Category Pivot Table</h3>
                        <p class="text-xs text-text-secondary">Click any sub-category to view transactions</p>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="pivot-table" id="pivotTable"></table>
                    </div>
                </div>

                <!-- Trend Charts -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                    <div class="chart-card">
                        <h3 class="font-bold mb-3">Income vs Expenses</h3>
                        <div style="height: 280px;"><canvas id="trendBarChart"></canvas></div>
                    </div>
                    <div class="chart-card">
                        <h3 class="font-bold mb-3">Cumulative Cash Flow</h3>
                        <div style="height: 280px;"><canvas id="cumulativeChart"></canvas></div>
                    </div>
                </div>

                <!-- Distribution Charts -->
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                    <div class="chart-card">
                        <h3 class="font-bold mb-3">Category Distribution</h3>
                        <div class="flex flex-col items-center">
                            <div style="width: 260px; height: 260px;"><canvas id="categoryDonut"></canvas></div>
                            <div id="categoryLegend" class="w-full mt-4 space-y-1.5 max-h-48 overflow-y-auto"></div>
                        </div>
                    </div>
                    <div class="chart-card">
                        <h3 class="font-bold mb-3">Sub-category Breakdown</h3>
                        <div style="height: ${Math.max(280, l2_distribution.length * 28)}px;"><canvas id="l2Bar"></canvas></div>
                    </div>
                </div>
            `;

            renderTrendBar(monthly_trend);
            renderCumulative(monthly_trend);
            renderCategoryDonut(category_distribution);
            renderL2Bar(l2_distribution);
            renderPivotTable(pivot_table, pivot_grand_total, account_types || ['Savings', 'CreditCard']);
        }

        // ── Pivot Table ──────────────────────────────────────────────────────
        function renderPivotTable(pivotData, grandTotal, accountTypes = ['Savings', 'CreditCard']) {
            state.currentPivotData = pivotData;
            const table = document.getElementById('pivotTable');
            if (!table) return;

            const fmtCell = (v) => '\u20B9' + Math.abs(v || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            const diffColor = (v) => (v || 0) > 0 ? 'text-green-400' : (v || 0) < 0 ? 'text-red-400' : 'text-text-secondary';

            const accountHeader = accountTypes.map(type => `<th colspan="2" class="text-center border-l border-border-dark">${type}</th>`).join('');
            const valueHeader = accountTypes.map(() => `<th class="amount border-l border-border-dark">Debit</th><th class="amount">Credit</th>`).join('');

            let html = `
                <thead>
                    <tr>
                        <th rowspan="2" class="text-left">Row Labels</th>
                        ${accountHeader}
                        <th rowspan="2" class="amount border-l border-border-dark">Total Debit</th>
                        <th rowspan="2" class="amount">Total Credit</th>
                        <th rowspan="2" class="amount">Difference</th>
                    </tr>
                    <tr>
                        ${valueHeader}
                    </tr>
                </thead>
                <tbody>`;

            pivotData.forEach((l1, idx) => {
                const hasChildren = l1.children && l1.children.length > 0;
                const accountCells = accountTypes.map(type => {
                    const vals = (l1.by_account && l1.by_account[type]) || { debit: 0, credit: 0 };
                    return `<td class="amount text-red-400/90 border-l border-border-dark">${fmtCell(vals.debit)}</td><td class="amount text-green-400/90">${fmtCell(vals.credit)}</td>`;
                }).join('');

                html += `
                    <tr class="pivot-l1" onclick="togglePivotChildren(${idx})">
                        <td class="text-left font-bold">
                            ${hasChildren ? `<span class="material-symbols-outlined text-sm align-middle mr-1 pivot-arrow" id="pivotArrow${idx}" style="font-size:16px;transition:transform 0.2s">chevron_right</span>` : '<span style="display:inline-block;width:20px"></span>'}
                            ${l1.name}
                        </td>
                        ${accountCells}
                        <td class="amount text-red-400 font-bold border-l border-border-dark">${fmtCell(l1.total_debit)}</td>
                        <td class="amount text-green-400 font-bold">${fmtCell(l1.total_credit)}</td>
                        <td class="amount font-bold ${diffColor(l1.difference)}">${l1.difference >= 0 ? '' : '-'}${fmtCell(l1.difference)}</td>
                    </tr>`;

                if (hasChildren) {
                    l1.children.forEach((l2, l2Idx) => {
                        const childAccCells = accountTypes.map(type => {
                            const vals = (l2.by_account && l2.by_account[type]) || { debit: 0, credit: 0 };
                            return `<td class="amount border-l border-border-dark">${fmtCell(vals.debit)}</td><td class="amount">${fmtCell(vals.credit)}</td>`;
                        }).join('');

                        html += `
                            <tr class="pivot-l2 pivot-hidden pivot-child-${idx}" onclick="openPivotDrillDown(${idx}, ${l2Idx})">
                                <td class="text-left pl-8">${l2.name}</td>
                                ${childAccCells}
                                <td class="amount text-red-400/90 border-l border-border-dark">${fmtCell(l2.total_debit)}</td>
                                <td class="amount text-green-400/90">${fmtCell(l2.total_credit)}</td>
                                <td class="amount ${diffColor(l2.difference)}">${l2.difference >= 0 ? '' : '-'}${fmtCell(l2.difference)}</td>
                            </tr>`;
                    });
                }
            });

            const grandAccCells = accountTypes.map(type => {
                const vals = (grandTotal.by_account && grandTotal.by_account[type]) || { debit: 0, credit: 0 };
                return `<td class="amount text-red-400 border-l border-border-dark">${fmtCell(vals.debit)}</td><td class="amount text-green-400">${fmtCell(vals.credit)}</td>`;
            }).join('');

            html += `
                <tr class="pivot-grand border-t-2 border-border-dark font-extrabold bg-surface-dark-2">
                    <td class="text-left">Grand Total</td>
                    ${grandAccCells}
                    <td class="amount text-red-400 border-l border-border-dark">${fmtCell(grandTotal.total_debit)}</td>
                    <td class="amount text-green-400">${fmtCell(grandTotal.total_credit)}</td>
                    <td class="amount ${diffColor(grandTotal.difference)}">${grandTotal.difference >= 0 ? '' : '-'}${fmtCell(grandTotal.difference)}</td>
                </tr>`;

            html += '</tbody>';
            table.innerHTML = html;
        }

        function togglePivotChildren(idx) {
            const rows = document.querySelectorAll(`.pivot-child-${idx}`);
            const arrow = document.getElementById(`pivotArrow${idx}`);
            const isHidden = rows[0]?.classList.contains('pivot-hidden');
            rows.forEach(r => r.classList.toggle('pivot-hidden', !isHidden));
            if (arrow) arrow.style.transform = isHidden ? 'rotate(90deg)' : '';
        }

        async function openPivotDrillDown(l1Idx, l2Idx) {
            const modal = document.getElementById('pivotModal');
            const title = document.getElementById('pivotModalTitle');
            const subtitle = document.getElementById('pivotModalSubtitle');
            const list = document.getElementById('pivotModalList');

            const l1Obj = state.currentPivotData ? state.currentPivotData[l1Idx] : null;
            const l2Obj = l1Obj && l1Obj.children ? l1Obj.children[l2Idx] : null;
            const l1Name = l1Obj ? l1Obj.name : '';
            const l2Name = l2Obj ? l2Obj.name : '';

            title.textContent = `${l1Name} > ${l2Name}`;
            subtitle.textContent = `Filtered transactions`;
            list.innerHTML = '<div class="flex justify-center py-8"><div class="size-8 border-2 border-primary/30 border-t-primary rounded-full animate-spin"></div></div>';

            modal.classList.remove('hidden');
            modal.classList.add('flex');

            if (!state.categoriesList) {
                try {
                    const res = await fetch('/api/categories');
                    state.categoriesList = await res.json();
                } catch (e) {}
            }
            let l1CatId = null;
            let l2CatId = null;
            const l1Cat = (state.categoriesList || []).find(c => c.name === l1Name);
            if (l1Cat) {
                l1CatId = l1Cat.id;
                if (l1Cat.children && l2Name) {
                    const l2Cat = l1Cat.children.find(c => c.name === l2Name);
                    if (l2Cat) l2CatId = l2Cat.id;
                }
            }

            try {
                let url = `/api/transactions?skip=0&limit=200`;
                if (state.accountType) url += `&account_type=${encodeURIComponent(state.accountType)}`;
                if (state.dateFrom) url += `&date_from=${encodeURIComponent(state.dateFrom)}`;
                if (state.dateTo) url += `&date_to=${encodeURIComponent(state.dateTo)}`;
                if (l1CatId) url += `&l1_category_id=${encodeURIComponent(l1CatId)}`;
                if (l2CatId) url += `&l2_category_id=${encodeURIComponent(l2CatId)}`;

                const res = await fetch(url);
                const data = await res.json();
                const txns = data.data || [];

                if (!txns.length) {
                    list.innerHTML = '<p class="text-center text-text-secondary py-8">No matching transactions found</p>';
                    return;
                }

                list.innerHTML = txns.map(t => {
                    const name = t.merchant_name || t.cleaned_details || t.raw_details || 'Transaction';
                    const subtitleText = [t.flow_direction, t.account_name].filter(Boolean).join(' • ');
                    const amtStr = t.debit ? `- ₹${t.debit.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}` : t.credit ? `+ ₹${t.credit.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}` : '₹0.00';
                    const amtClass = t.debit ? 'text-red-400' : t.credit ? 'text-green-400' : 'text-gray-300';
                    return `
                    <div class="bg-background-dark p-3.5 rounded-xl border border-border-dark flex items-center justify-between transition-all">
                        <div class="flex-1 min-w-0 mr-3">
                            <p class="font-bold text-sm truncate capitalize">${esc(name)}</p>
                            ${subtitleText ? `<p class="text-xs text-text-secondary truncate mt-0.5">${esc(subtitleText)}</p>` : ''}
                            <p class="text-xs text-gray-400 mt-1">${esc(t.parsed_date || t.raw_date || '')}</p>
                        </div>
                        <div class="text-right shrink-0">
                            <p class="text-sm font-bold ${amtClass}">${amtStr}</p>
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold ${t.review_status !== 'pending' ? 'bg-green-900/30 text-green-400' : 'bg-yellow-900/30 text-yellow-400'} mt-1 inline-block">${esc(t.review_status)}</span>
                        </div>
                    </div>`;
                }).join('');
            } catch (e) {
                list.innerHTML = `<p class="text-center text-red-500 py-8">Failed to load transactions: ${e.message}</p>`;
            }
        }

        function closePivotModal() {
            const modal = document.getElementById('pivotModal');
            if (modal) { modal.classList.add('hidden'); modal.classList.remove('flex'); }
        }

        // ── Chart Renderers ──────────────────────────────────────────────────

        function renderTrendBar(trend) {
            const ctx = document.getElementById('trendBarChart')?.getContext('2d');
            if (!ctx) return;
            charts.trendBar = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: trend.map(t => fmtMonth(t.month)),
                    datasets: [
                        {
                            label: 'Income', data: trend.map(t => t.income),
                            backgroundColor: 'rgba(34, 197, 94, 0.7)', borderColor: '#22c55e',
                            borderWidth: 1, borderRadius: 4,
                        },
                        {
                            label: 'Expenses', data: trend.map(t => t.expenses),
                            backgroundColor: 'rgba(239, 68, 68, 0.7)', borderColor: '#ef4444',
                            borderWidth: 1, borderRadius: 4,
                        }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    interaction: { intersect: false, mode: 'index' },
                    plugins: {
                        legend: { position: 'top', labels: { usePointStyle: true, padding: 12, font: { size: 11 } } },
                        tooltip: { backgroundColor: '#1c232d', borderColor: '#2a3441', borderWidth: 1,
                            callbacks: { label: ctx => `${ctx.dataset.label}: ${fmt(ctx.parsed.y)}` } }
                    },
                    scales: {
                        y: { grid: { color: 'rgba(42,52,65,0.5)' }, ticks: { callback: v => fmt(v), font: { size: 10 } } },
                        x: { grid: { display: false }, ticks: { font: { size: 10 } } }
                    }
                }
            });
        }

        function renderCumulative(trend) {
            const ctx = document.getElementById('cumulativeChart')?.getContext('2d');
            if (!ctx) return;
            charts.cumulative = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: trend.map(t => fmtMonth(t.month)),
                    datasets: [{
                        label: 'Cumulative', data: trend.map(t => t.cumulative),
                        borderColor: '#137fec', backgroundColor: 'rgba(19, 127, 236, 0.1)',
                        fill: true, tension: 0.35, pointRadius: 3, pointBackgroundColor: '#137fec', borderWidth: 2,
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: { backgroundColor: '#1c232d', borderColor: '#2a3441', borderWidth: 1,
                            callbacks: { label: ctx => `Net: ${ctx.parsed.y >= 0 ? '+' : ''}${fmt(ctx.parsed.y)}` } }
                    },
                    scales: {
                        y: { grid: { color: 'rgba(42,52,65,0.5)' }, ticks: { callback: v => fmt(v), font: { size: 10 } } },
                        x: { grid: { display: false }, ticks: { font: { size: 10 } } }
                    }
                }
            });
        }

        function renderCategoryDonut(categories) {
            const ctx = document.getElementById('categoryDonut')?.getContext('2d');
            if (!ctx) return;
            const colors = categories.map((c, i) => c.color || CHART_COLORS[i % CHART_COLORS.length]);
            charts.donut = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: categories.map(c => c.name),
                    datasets: [{ data: categories.map(c => c.total), backgroundColor: colors, borderColor: '#1c232d', borderWidth: 2 }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false, cutout: '65%',
                    plugins: {
                        legend: { display: false },
                        tooltip: { backgroundColor: '#1c232d', borderColor: '#2a3441', borderWidth: 1,
                            callbacks: { label: ctx => `${ctx.label}: ${fmt(ctx.parsed)} (${categories[ctx.dataIndex]?.percentage || 0}%)` } }
                    }
                }
            });

            const legend = document.getElementById('categoryLegend');
            if (legend) {
                legend.innerHTML = categories.map((c, i) => `
                    <div class="flex items-center gap-2 px-2 py-1 rounded hover:bg-surface-dark-2 transition-colors">
                        <div class="w-2.5 h-2.5 rounded-full shrink-0" style="background:${colors[i]}"></div>
                        <span class="flex-1 text-sm truncate">${c.name}</span>
                        <span class="text-sm font-semibold">${fmt(c.total)}</span>
                        <span class="text-xs text-text-secondary w-10 text-right">${c.percentage}%</span>
                    </div>
                `).join('');
            }
        }

        function renderL2Bar(l2data) {
            const ctx = document.getElementById('l2Bar')?.getContext('2d');
            if (!ctx || !l2data.length) {
                const container = document.getElementById('l2Bar')?.parentElement;
                if (container) container.innerHTML = '<p class="text-center text-text-secondary py-8">No sub-category data</p>';
                return;
            }
            charts.l2bar = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: l2data.map(d => d.name.length > 20 ? d.name.slice(0, 18) + '...' : d.name),
                    datasets: [{
                        label: 'Amount', data: l2data.map(d => d.total),
                        backgroundColor: CHART_COLORS.slice(0, l2data.length).map(c => c + 'BB'),
                        borderColor: CHART_COLORS.slice(0, l2data.length),
                        borderWidth: 1, borderRadius: 4,
                    }]
                },
                options: {
                    indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: { backgroundColor: '#1c232d', borderColor: '#2a3441', borderWidth: 1,
                            callbacks: { label: ctx => `${fmt(l2data[ctx.dataIndex].total)} (${l2data[ctx.dataIndex].percentage}%)` } }
                    },
                    scales: {
                        x: { grid: { color: 'rgba(42,52,65,0.5)' }, ticks: { callback: v => fmt(v), font: { size: 10 } } },
                        y: { grid: { display: false }, ticks: { font: { size: 11 } } }
                    }
                }
            });
        }

        // ── Boot ─────────────────────────────────────────────────────────────
        renderShell();
        loadDashboard();
    </script>

    <!-- Pivot Drill-down Modal -->
    <div id="pivotModal" class="fixed inset-0 bg-black/70 items-center justify-center z-50 hidden p-4">
        <div class="bg-surface-dark rounded-xl border border-border-dark w-full max-w-2xl max-h-[85vh] flex flex-col shadow-2xl">
            <div class="flex items-center justify-between p-4 border-b border-border-dark">
                <div>
                    <h2 id="pivotModalTitle" class="text-lg font-bold text-white">Sub-category Transactions</h2>
                    <p id="pivotModalSubtitle" class="text-xs text-text-secondary mt-0.5"></p>
                </div>
                <button onclick="closePivotModal()" class="p-2 text-text-secondary hover:text-white rounded-full"><span class="material-symbols-outlined">close</span></button>
            </div>
            <div id="pivotModalList" class="flex-1 overflow-y-auto p-4 space-y-2">
                <div class="flex justify-center py-8"><div class="size-8 border-2 border-primary/30 border-t-primary rounded-full animate-spin"></div></div>
            </div>
        </div>
    </div>
</body>
</html>
