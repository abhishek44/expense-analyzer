<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
    <title>Expense Tracker</title>

    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                        "surface-dark": "#1c232d",
                        "border-dark": "#2a3441",
                        "text-secondary": "#9dabb9"
                    },
                    fontFamily: { "display": ["Manrope", "sans-serif"] },
                },
            },
        }
    </script>
    <style>
        body { min-height: 100dvh; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .filter-popover { display: none; animation: slideDown 0.2s ease-out; }
        .filter-popover.open { display: block; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
        .filter-backdrop { display: none; position: fixed; inset: 0; z-index: 14; }
        .filter-backdrop.open { display: block; }
        .flatpickr-calendar { z-index: 9999 !important; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</head>

<body class="bg-background-light dark:bg-background-dark text-gray-900 dark:text-white font-display">
    <div id="app" class="min-h-screen flex flex-col"></div>

    <script>
        const API_BASE = '/api';
        let selectedFile = null;
        const PAGE_SIZE = 100;
        const appState = {
            filters: { status: '', accountName: '', accountType: '', l1CategoryId: '', dateFrom: '', dateTo: '' },
            currentRequestToken: 0,
            loadedTransactions: [],
            totalTransactions: 0,
            currentSkip: 0,
            categories: [],  // cached [{id, name, level, parent_id, domain, children: [...]}]
        };

        const api = {
            async uploadCSV(file, accountName) {
                const formData = new FormData();
                formData.append('file', file);
                if (accountName) formData.append('account_name', accountName);
                const res = await fetch(`${API_BASE}/upload-csv`, { method: 'POST', body: formData });
                return res.json();
            },
            async getTransactions(status, filename, accountName, accountType, l1CategoryId, skip, limit, dateFrom, dateTo) {
                let url = `${API_BASE}/transactions?skip=${skip || 0}&limit=${limit || PAGE_SIZE}`;
                if (status) url += `&status_filter=${status}`;
                if (filename) url += `&filename_filter=${encodeURIComponent(filename)}`;
                if (accountName) url += `&account_name=${encodeURIComponent(accountName)}`;
                if (accountType) url += `&account_type=${encodeURIComponent(accountType)}`;
                if (l1CategoryId) url += `&l1_category_id=${encodeURIComponent(l1CategoryId)}`;
                if (dateFrom) url += `&date_from=${encodeURIComponent(dateFrom)}`;
                if (dateTo) url += `&date_to=${encodeURIComponent(dateTo)}`;
                const res = await fetch(url);
                return res.json();
            },
            async getTransaction(id) { return (await fetch(`${API_BASE}/transactions/${id}`)).json(); },
            async reviewTransaction(id, data) {
                return (await fetch(`${API_BASE}/transactions/${id}/review`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
                })).json();
            },
            async deleteTransaction(id) { return (await fetch(`${API_BASE}/transactions/${id}`, { method: 'DELETE' })).json(); },
            async getFilterOptions() { return (await fetch(`${API_BASE}/filter-options`)).json(); },
            async getTables() { return (await fetch(`${API_BASE}/tables`)).json(); },
            async getUploadedFiles() { return (await fetch(`${API_BASE}/uploaded-files`)).json(); },
            async deleteFile(filename) { return (await fetch(`${API_BASE}/uploaded-files/${encodeURIComponent(filename)}`, { method: 'DELETE' })).json(); },
            async clearTable(name) { return (await fetch(`${API_BASE}/tables/${name}/clear`, { method: 'DELETE' })).json(); },
            async createTransaction(data) {
                return (await fetch(`${API_BASE}/transactions`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })).json();
            },
            async getAccounts() { return (await fetch(`${API_BASE}/accounts`)).json(); },
            async createAccount(data) { return (await fetch(`${API_BASE}/accounts`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })).json(); },
            async updateAccount(id, data) { return (await fetch(`${API_BASE}/accounts/${id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })).json(); },
            async deleteAccount(id) { return (await fetch(`${API_BASE}/accounts/${id}`, { method: 'DELETE' })).json(); },
            async getCategories() { return (await fetch(`${API_BASE}/categories`)).json(); },
            async createCategory(data) { return (await fetch(`${API_BASE}/categories`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })).json(); },
            async updateCategory(id, data) { return (await fetch(`${API_BASE}/categories/${id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })).json(); },
            async deleteCategory(id) { const r = await fetch(`${API_BASE}/categories/${id}`, { method: 'DELETE' }); return r.status === 204 ? { success: true } : r.json(); },
            async getMerchantSuggestion(id) { return (await fetch(`${API_BASE}/merchant-suggestion/${id}`)).json(); },
        };

        // Load categories once on startup
        async function loadCategories() {
            try { appState.categories = await api.getCategories(); } catch (e) { console.error(e); }
        }
        loadCategories();

        function getL1Categories() { return appState.categories; }
        function getL2Children(l1Id) {
            const cat = appState.categories.find(c => c.id === l1Id);
            return cat ? (cat.children || []) : [];
        }

        const router = {
            currentRoute: 'home', params: {},
            navigate(route, params = {}) { this.currentRoute = route; this.params = params; this.render(); },
            render() {
                const app = document.getElementById('app');
                switch (this.currentRoute) {
                    case 'home': app.innerHTML = screens.home(); screens.initHome(); break;
                    case 'upload': app.innerHTML = screens.upload(); screens.initUpload(); break;
                    case 'files': app.innerHTML = screens.files(); screens.initFiles(); break;
                    case 'list': app.innerHTML = screens.list(); screens.initList(); break;
                    case 'details': app.innerHTML = screens.details(this.params.id); screens.initDetails(this.params.id); break;
                    case 'addExpense': app.innerHTML = screens.addExpense(); screens.initAddExpense(); break;
                    case 'settings': app.innerHTML = screens.settings(); screens.initSettings(); break;
                    case 'accounts': app.innerHTML = screens.accounts(); screens.initAccounts(); break;
                    case 'categories': app.innerHTML = screens.categoriesScreen(); screens.initCategories(); break;
                }
            }
        };

        const screens = {
            renderNav(active) {
                const navItem = (route, icon, label) => `
                    <button onclick="router.navigate('${route}')" class="flex flex-col items-center p-2 ${active === route ? 'text-primary' : 'text-text-secondary hover:text-primary'}">
                        <span class="material-symbols-outlined">${icon}</span>
                        <span class="text-xs mt-1">${label}</span>
                    </button>`;
                return `
                <nav class="fixed bottom-0 left-0 right-0 bg-surface-dark border-t border-border-dark z-50">
                    <div class="flex justify-around py-2">
                        ${navItem('home', 'home', 'Home')}
                        ${navItem('files', 'folder', 'Files')}
                        ${navItem('accounts', 'account_balance', 'Accounts')}
                        ${navItem('categories', 'category', 'Categories')}
                        <a href="/analytics" class="flex flex-col items-center p-2 text-text-secondary hover:text-primary">
                            <span class="material-symbols-outlined">insights</span><span class="text-xs mt-1">Analytics</span>
                        </a>
                        ${navItem('settings', 'settings', 'Settings')}
                    </div>
                </nav>`;
            },

            // ─── Home ─────────────────────────────────────────────────────────
            home() {
                return `
                <div class="flex flex-col min-h-screen pb-16">
                    <header class="flex items-center justify-between p-4 border-b border-border-dark">
                        <h1 class="text-xl font-bold">Expense Tracker</h1>
                        <button onclick="screens.exportReviewed()" class="flex items-center gap-1.5 h-9 px-3 rounded-lg bg-green-600 hover:bg-green-700 text-white text-sm font-semibold">
                            <span class="material-symbols-outlined text-lg">download</span><span>Export</span>
                        </button>
                    </header>
                    <main class="flex-1 p-4 space-y-4">
                        <div id="statsGrid" class="grid grid-cols-2 gap-3">
                            <div class="bg-surface-dark p-4 rounded-xl"><p class="text-text-secondary text-sm">Pending</p><p id="statPending" class="text-2xl font-bold text-yellow-500">-</p></div>
                            <div class="bg-surface-dark p-4 rounded-xl"><p class="text-text-secondary text-sm">Reviewed</p><p id="statReviewed" class="text-2xl font-bold text-green-500">-</p></div>
                        </div>
                    </main>
                    ${this.renderNav('home')}
                </div>`;
            },
            async initHome() {
                try {
                    const data = await api.getTables();
                    const t = data.tables.find(t => t.name === 'transactions');
                    if (t) { document.getElementById('statPending').textContent = t.pending || 0; document.getElementById('statReviewed').textContent = t.reviewed || 0; }
                } catch (e) { console.error(e); }
            },
            async exportReviewed() {
                try {
                    const res = await fetch(`${API_BASE}/export-transactions`);
                    if (!res.ok) { alert((await res.json()).detail || 'Export failed'); return; }
                    const blob = await res.blob();
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a'); a.href = url;
                    a.download = res.headers.get('Content-Disposition')?.split('filename=')[1] || 'transactions.csv';
                    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
                } catch (e) { alert('Export failed: ' + e.message); }
            },

            // ─── Upload ───────────────────────────────────────────────────────
            upload() {
                return `
                <div class="flex flex-col min-h-screen">
                    <header class="flex items-center p-4 border-b border-border-dark">
                        <button onclick="router.navigate('home')" class="p-2 -ml-2 rounded-full hover:bg-gray-700"><span class="material-symbols-outlined">arrow_back</span></button>
                        <h1 class="text-lg font-bold ml-2">Upload CSV</h1>
                    </header>
                    <main class="flex-1 p-4 space-y-4">
                        <div><label class="block text-sm font-medium mb-2">Account Name</label><input id="accountName" type="text" placeholder="e.g. HDFC 1234" class="w-full h-12 px-4 rounded-lg border border-border-dark bg-surface-dark" /></div>
                        <div id="dropZone" class="flex flex-col items-center gap-4 rounded-xl border-2 border-dashed border-border-dark p-8 cursor-pointer hover:border-primary">
                            <span class="material-symbols-outlined text-4xl text-primary">cloud_upload</span>
                            <p class="font-bold">Upload CSV File</p>
                            <p class="text-sm text-text-secondary">Tap to browse or drag file here</p>
                            <input type="file" id="fileInput" accept=".csv" class="hidden" />
                        </div>
                        <div id="uploadProgress" class="hidden bg-surface-dark p-4 rounded-xl">
                            <div class="flex items-center gap-4"><div class="size-8 border-2 border-primary/30 border-t-primary rounded-full animate-spin"></div><div><p class="font-bold">Uploading...</p><p id="uploadFileName" class="text-sm text-text-secondary"></p></div></div>
                        </div>
                    </main>
                </div>`;
            },
            initUpload() {
                const dz = document.getElementById('dropZone'), fi = document.getElementById('fileInput');
                dz.onclick = () => fi.click();
                dz.ondragover = e => { e.preventDefault(); dz.classList.add('border-primary'); };
                dz.ondragleave = () => dz.classList.remove('border-primary');
                dz.ondrop = e => { e.preventDefault(); if (e.dataTransfer.files[0]) this.handleUpload(e.dataTransfer.files[0]); };
                fi.onchange = e => { if (e.target.files[0]) this.handleUpload(e.target.files[0]); };
            },
            async handleUpload(file) {
                document.getElementById('uploadFileName').textContent = file.name;
                document.getElementById('dropZone').classList.add('hidden');
                document.getElementById('uploadProgress').classList.remove('hidden');
                try {
                    const result = await api.uploadCSV(file, document.getElementById('accountName').value);
                    if (result.success) { alert(`Uploaded ${result.rows_inserted} rows`); router.navigate('files'); }
                    else { alert('Failed: ' + (result.detail || 'Unknown')); document.getElementById('dropZone').classList.remove('hidden'); document.getElementById('uploadProgress').classList.add('hidden'); }
                } catch (e) { alert('Failed: ' + e.message); document.getElementById('dropZone').classList.remove('hidden'); document.getElementById('uploadProgress').classList.add('hidden'); }
            },

            // ─── Files ────────────────────────────────────────────────────────
            files() {
                return `
                <div class="flex flex-col min-h-screen pb-16">
                    <header class="flex items-center p-4 border-b border-border-dark"><h1 class="text-lg font-bold">Uploaded Files</h1></header>
                    <main id="filesList" class="flex-1 p-4 space-y-3 pb-20"><div class="flex justify-center py-8"><div class="size-8 border-2 border-primary/30 border-t-primary rounded-full animate-spin"></div></div></main>
                    <button onclick="router.navigate('addExpense')" class="fixed bottom-20 right-4 w-14 h-14 bg-primary text-white rounded-full shadow-lg flex items-center justify-center z-10"><span class="material-symbols-outlined text-3xl">add</span></button>
                    ${this.renderNav('files')}
                </div>`;
            },
            async initFiles() {
                const list = document.getElementById('filesList');
                try {
                    const data = await api.getUploadedFiles();
                    if (!data.files.length) { list.innerHTML = '<p class="text-center text-text-secondary py-8">No files uploaded yet</p>'; return; }
                    list.innerHTML = data.files.map(f => `
                        <div class="bg-surface-dark p-4 rounded-xl">
                            <div class="flex justify-between items-start mb-2">
                                <p class="font-bold truncate flex-1">${f.filename}</p>
                                <button onclick="screens.deleteFile('${f.filename.replace(/'/g, "\\'")}')" class="p-2 text-red-500 hover:bg-red-900/20 rounded-full"><span class="material-symbols-outlined">delete</span></button>
                            </div>
                            <div class="flex items-center gap-4 text-sm"><span class="text-yellow-500">${f.pending_count} pending</span><span class="text-green-500">${f.reviewed_count} reviewed</span></div>
                            <button onclick="selectedFile='${f.filename.replace(/'/g, "\\'")}'; router.navigate('list')" class="mt-3 w-full h-10 bg-primary text-white font-bold rounded-lg">View Transactions</button>
                        </div>`).join('');
                } catch (e) { list.innerHTML = '<p class="text-center text-red-500 py-8">Failed to load</p>'; }
            },
            async deleteFile(filename) {
                if (!confirm(`Delete all records for "${filename}"?`)) return;
                try { const r = await api.deleteFile(filename); if (r.success) { alert(r.message); this.initFiles(); } } catch (e) { alert(e.message); }
            },

            // ─── Transaction List ─────────────────────────────────────────────
            list() {
                const { status } = appState.filters;
                return `
                <div class="flex flex-col min-h-screen pb-16">
                    <header class="sticky top-0 z-10 bg-background-dark border-b border-border-dark">
                        <div class="flex items-center p-4">
                            <button onclick="router.navigate('files')" class="p-2 -ml-2 rounded-full hover:bg-gray-700"><span class="material-symbols-outlined">arrow_back</span></button>
                            <h1 class="text-lg font-bold ml-2 truncate flex-1">${selectedFile || 'All Transactions'}</h1>
                        </div>
                        <div class="flex gap-2 px-4 pb-3 overflow-x-auto no-scrollbar">
                            <button data-filter="" class="filter-chip ${!status ? 'bg-primary text-white' : 'bg-surface-dark border border-gray-700'} shrink-0 h-8 px-4 rounded-full text-sm font-bold">All</button>
                            <button data-filter="pending" class="filter-chip ${status === 'pending' ? 'bg-primary text-white' : 'bg-surface-dark border border-gray-700'} shrink-0 h-8 px-4 rounded-full text-sm">Pending</button>
                            <button data-filter="approved" class="filter-chip ${status === 'approved' ? 'bg-primary text-white' : 'bg-surface-dark border border-gray-700'} shrink-0 h-8 px-4 rounded-full text-sm">Reviewed</button>
                        </div>
                    </header>
                    <main id="statementsList" class="flex-1 p-4 space-y-3 pb-20"><div class="flex justify-center py-8"><div class="size-8 border-2 border-primary/30 border-t-primary rounded-full animate-spin"></div></div></main>
                    <button onclick="router.navigate('addExpense')" class="fixed bottom-20 right-4 w-14 h-14 bg-primary text-white rounded-full shadow-lg flex items-center justify-center z-20"><span class="material-symbols-outlined text-3xl">add</span></button>
                    ${this.renderNav('list')}
                </div>`;
            },
            async initList() {
                document.querySelectorAll('.filter-chip').forEach(chip => {
                    chip.onclick = () => {
                        document.querySelectorAll('.filter-chip').forEach(c => { c.classList.remove('bg-primary', 'text-white'); c.classList.add('bg-surface-dark', 'border'); });
                        chip.classList.add('bg-primary', 'text-white'); chip.classList.remove('bg-surface-dark', 'border');
                        appState.filters.status = chip.dataset.filter;
                        this.loadStatements();
                    };
                });
                await this.loadStatements();
            },
            async loadStatements(append = false) {
                const list = document.getElementById('statementsList');
                if (!list) return;
                const { status, accountName, accountType, l1CategoryId, dateFrom, dateTo } = appState.filters;
                const requestToken = ++appState.currentRequestToken;

                if (!append) { appState.loadedTransactions = []; appState.currentSkip = 0; list.innerHTML = '<div class="flex justify-center py-8"><div class="size-8 border-2 border-primary/30 border-t-primary rounded-full animate-spin"></div></div>'; }

                try {
                    const data = await api.getTransactions(status, selectedFile, accountName, accountType, l1CategoryId, appState.currentSkip, PAGE_SIZE, dateFrom, dateTo);
                    if (requestToken !== appState.currentRequestToken) return;

                    appState.totalTransactions = data.total;
                    appState.loadedTransactions = append ? [...appState.loadedTransactions, ...data.data] : data.data;
                    appState.currentSkip += data.data.length;

                    if (!appState.loadedTransactions.length) { list.innerHTML = '<p class="text-center text-text-secondary py-8">No transactions found</p>'; return; }

                    const cards = appState.loadedTransactions.map(t => {
                        const name = t.merchant_name || t.cleaned_details || t.raw_details || 'Transaction';
                        const subtitle = [t.flow_direction, t.account_name].filter(Boolean).join(' • ');
                        const amtClass = t.debit ? 'text-red-500' : 'text-green-500';
                        const amtStr = t.debit ? `- ₹${t.debit.toLocaleString()}` : t.credit ? `+ ₹${t.credit.toLocaleString()}` : '₹0';
                        return `
                        <div onclick="router.navigate('details', {id: ${t.id}})" class="bg-surface-dark p-4 rounded-xl cursor-pointer hover:shadow-md transition-shadow">
                            <div class="flex justify-between items-start">
                                <div class="flex-1 min-w-0 mr-3">
                                    <p class="font-bold truncate capitalize">${name}</p>
                                    ${subtitle ? `<p class="text-xs text-text-secondary truncate">${subtitle}</p>` : ''}
                                    <p class="text-sm ${amtClass}">${amtStr}</p>
                                </div>
                                <div class="text-right shrink-0">
                                    <span class="px-2 py-1 rounded text-xs font-bold ${t.review_status !== 'pending' ? 'bg-green-900/30 text-green-400' : 'bg-yellow-900/30 text-yellow-400'}">${t.review_status}</span>
                                    <p class="text-xs text-gray-400 mt-1">${t.parsed_date || t.raw_date || ''}</p>
                                </div>
                            </div>
                        </div>`;
                    }).join('');

                    const hasMore = appState.loadedTransactions.length < appState.totalTransactions;
                    const footer = `<div class="py-4 text-center"><p class="text-text-secondary text-sm mb-2">Showing ${appState.loadedTransactions.length} of ${appState.totalTransactions}</p>${hasMore ? `<button onclick="screens.loadStatements(true)" class="h-10 px-6 bg-primary text-white font-bold text-sm rounded-lg">Load More</button>` : ''}</div>`;
                    list.innerHTML = cards + footer;
                } catch (e) { if (requestToken === appState.currentRequestToken && !append) list.innerHTML = '<p class="text-center text-red-500 py-8">Failed to load</p>'; }
            },

            // ─── Transaction Details / Review ─────────────────────────────────
            details(id) {
                return `
                <div class="flex flex-col min-h-screen">
                    <header class="flex items-center p-4 border-b border-border-dark">
                        <button onclick="router.navigate('list')" class="p-2 -ml-2 rounded-full hover:bg-gray-700"><span class="material-symbols-outlined">arrow_back</span></button>
                        <h1 class="text-lg font-bold ml-2">Transaction Details</h1>
                    </header>
                    <main id="detailsContent" class="flex-1 p-4 pb-32"><div class="flex justify-center py-8"><div class="size-8 border-2 border-primary/30 border-t-primary rounded-full animate-spin"></div></div></main>
                    <footer id="detailsFooter" class="fixed bottom-0 left-0 right-0 p-4 pb-8 bg-background-dark border-t border-border-dark hidden">
                        <button id="approveBtn" class="w-full h-12 bg-primary text-white font-bold rounded-xl flex items-center justify-center gap-2"><span class="material-symbols-outlined">check</span> Review</button>
                    </footer>
                </div>`;
            },
            async initDetails(id) {
                const content = document.getElementById('detailsContent');
                const footer = document.getElementById('detailsFooter');
                try {
                    const [t, suggestion] = await Promise.all([api.getTransaction(id), api.getMerchantSuggestion(id)]);
                    const isPending = t.review_status === 'pending';
                    const merchantDisplay = t.merchant_name || t.cleaned_details || null;
                    const notesRequired = suggestion.suggestion?.notes_required || false;

                    const amtClass = t.debit ? 'text-red-500' : 'text-green-500';
                    const amtStr = t.debit ? `- ₹${t.debit.toLocaleString()}` : t.credit ? `+ ₹${t.credit.toLocaleString()}` : '₹0';

                    content.innerHTML = `
                        <div class="space-y-4">
                            <div class="bg-surface-dark p-4 rounded-xl">
                                ${merchantDisplay ? `<p class="text-xl font-bold capitalize">${merchantDisplay}</p><p class="text-sm text-text-secondary mt-1">${[t.flow_direction, t.account_name].filter(Boolean).join(' • ')}</p>` : `<p class="text-lg font-bold">${t.raw_details || 'Transaction'}</p>`}
                                <p class="text-2xl font-bold mt-3 ${amtClass}">${amtStr}</p>
                                <p class="text-sm text-text-secondary mt-1">${t.parsed_date || t.raw_date || ''}</p>
                            </div>

                            <details class="bg-surface-dark rounded-xl">
                                <summary class="p-4 cursor-pointer text-sm font-bold text-text-secondary flex items-center gap-2"><span class="material-symbols-outlined text-base">info</span> Raw Details</summary>
                                <div class="px-4 pb-4 text-xs font-mono break-all bg-background-dark mx-4 mb-4 p-2 rounded">${t.raw_details || '-'}</div>
                            </details>

                            <div id="suggestionBanner" class="hidden"></div>

                            <div class="bg-surface-dark p-4 rounded-xl space-y-4">
                                <h3 class="text-sm font-bold text-text-secondary">Review</h3>
                                <div>
                                    <label class="text-xs text-text-secondary">L1 Category</label>
                                    <select id="reviewL1" class="w-full h-10 px-3 mt-1 rounded-lg border border-border-dark bg-surface-dark text-sm">
                                        <option value="">- Select Category -</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="text-xs text-text-secondary">L2 Sub-category (optional)</label>
                                    <select id="reviewL2" class="w-full h-10 px-3 mt-1 rounded-lg border border-border-dark bg-surface-dark text-sm">
                                        <option value="">- None -</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="text-xs text-text-secondary">Notes</label>
                                    ${notesRequired ? `<p class="text-xs text-yellow-500 mt-0.5 mb-1 flex items-center gap-1"><span class="material-symbols-outlined text-sm">info</span> Ambiguous merchant - a note helps future predictions</p>` : ''}
                                    <textarea id="reviewNotes" placeholder="${notesRequired ? 'What did you buy?' : 'Optional notes...'}" class="w-full h-16 p-3 mt-1 rounded-lg border ${notesRequired ? 'border-yellow-500/50' : 'border-border-dark'} bg-surface-dark text-sm resize-none"></textarea>
                                </div>
                            </div>

                            <button id="deleteBtn" class="w-full h-12 bg-red-900/30 text-red-500 font-bold rounded-xl flex items-center justify-center gap-2"><span class="material-symbols-outlined">delete</span> Delete</button>
                        </div>`;

                    // Populate L1 dropdown
                    const l1Select = document.getElementById('reviewL1');
                    const l2Select = document.getElementById('reviewL2');
                    const notesInput = document.getElementById('reviewNotes');
                    const cats = getL1Categories();

                    cats.forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = c.id; opt.textContent = c.name;
                        l1Select.appendChild(opt);
                    });

                    // Cascade: when L1 changes, populate L2
                    l1Select.onchange = () => {
                        l2Select.innerHTML = '<option value="">- None -</option>';
                        const children = getL2Children(l1Select.value);
                        children.forEach(c => {
                            const opt = document.createElement('option');
                            opt.value = c.id; opt.textContent = c.name;
                            l2Select.appendChild(opt);
                        });
                        if (t.l2_category_id) l2Select.value = t.l2_category_id;
                    };

                    // Pre-fill
                    if (t.l1_category_id) { l1Select.value = t.l1_category_id; l1Select.onchange(); }
                    if (t.notes) notesInput.value = t.notes;

                    // Suggestion banner
                    if (suggestion.suggestion && isPending) {
                        const s = suggestion.suggestion;
                        const banner = document.getElementById('suggestionBanner');
                        if (s.confidence === 'deterministic') {
                            banner.innerHTML = `<div class="bg-green-900/20 border border-green-800 p-3 rounded-xl flex items-center justify-between">
                                <div><p class="text-sm font-bold text-green-400">Suggested: ${s.l1_category_name}${s.l2_category_name ? ' > ' + s.l2_category_name : ''}</p><p class="text-xs text-green-500">Based on ${s.occurrence_count} past transactions</p></div>
                                <button onclick="document.getElementById('reviewL1').value='${s.l1_category_id}';document.getElementById('reviewL1').onchange()" class="px-3 py-1.5 bg-green-600 text-white text-xs font-bold rounded-lg">Apply</button>
                            </div>`;
                        } else {
                            banner.innerHTML = `<div class="bg-yellow-900/20 border border-yellow-800 p-3 rounded-xl"><p class="text-sm font-bold text-yellow-400">Ambiguous merchant</p><p class="text-xs text-yellow-500">Multiple categories used. Add a note to help.</p></div>`;
                        }
                        banner.classList.remove('hidden');
                    }

                    footer.classList.remove('hidden');
                    const approveBtn = document.getElementById('approveBtn');
                    approveBtn.innerHTML = isPending ? '<span class="material-symbols-outlined">check</span> Review' : '<span class="material-symbols-outlined">update</span> Update';

                    approveBtn.onclick = async () => {
                        if (!l1Select.value) { alert('Please select a category'); return; }
                        const data = { l1_category_id: l1Select.value, l2_category_id: l2Select.value || null, notes: notesInput.value || null, review_status: 'approved' };
                        try { const r = await api.reviewTransaction(id, data); if (r.success) router.navigate('list'); else alert(r.detail || 'Failed'); } catch (e) { alert(e.message); }
                    };

                    document.getElementById('deleteBtn').onclick = async () => {
                        if (!confirm('Delete this transaction?')) return;
                        try { const r = await api.deleteTransaction(id); if (r.success) router.navigate('list'); } catch (e) { alert(e.message); }
                    };
                } catch (e) { content.innerHTML = '<p class="text-center text-red-500 py-8">Failed to load</p>'; console.error(e); }
            },

            // ─── Add Manual Expense ───────────────────────────────────────────
            addExpense() {
                return `
                <div class="flex flex-col min-h-screen">
                    <header class="flex items-center p-4 border-b border-border-dark">
                        <button onclick="router.navigate('home')" class="p-2 -ml-2 rounded-full hover:bg-gray-700"><span class="material-symbols-outlined">arrow_back</span></button>
                        <h1 class="text-lg font-bold ml-2">Add Expense</h1>
                    </header>
                    <main class="flex-1 p-4 space-y-4">
                        <div class="grid grid-cols-2 gap-3">
                            <div><label class="text-sm font-medium">Date</label><input id="manualDate" type="date" class="w-full h-12 px-4 mt-1 rounded-lg border border-border-dark bg-surface-dark" value="${new Date().toISOString().split('T')[0]}" /></div>
                            <div><label class="text-sm font-medium">Type</label><select id="manualType" class="w-full h-12 px-4 mt-1 rounded-lg border border-border-dark bg-surface-dark"><option value="Debit">Debit</option><option value="Credit">Credit</option></select></div>
                        </div>
                        <div><label class="text-sm font-medium">Amount</label><input id="manualAmount" type="number" step="0.01" placeholder="0.00" class="w-full h-12 px-4 mt-1 rounded-lg border border-border-dark bg-surface-dark" /></div>
                        <div><label class="text-sm font-medium">Details</label><input id="manualDetails" type="text" placeholder="Description" class="w-full h-12 px-4 mt-1 rounded-lg border border-border-dark bg-surface-dark" /></div>
                        <div class="grid grid-cols-2 gap-3">
                            <div><label class="text-sm font-medium">Account</label><input id="manualAccount" type="text" placeholder="HDFC, Cash..." class="w-full h-12 px-4 mt-1 rounded-lg border border-border-dark bg-surface-dark" /></div>
                            <div><label class="text-sm font-medium">Account Type</label><select id="manualAccountType" class="w-full h-12 px-4 mt-1 rounded-lg border border-border-dark bg-surface-dark"><option value="Savings">Savings</option><option value="Credit Card">Credit Card</option><option value="Current">Current</option><option value="Cash">Cash</option></select></div>
                        </div>
                        <div><label class="text-sm font-medium">Category</label><select id="manualCategory" class="w-full h-12 px-4 mt-1 rounded-lg border border-border-dark bg-surface-dark"><option value="">- Optional -</option></select></div>
                        <div><label class="text-sm font-medium">Notes</label><textarea id="manualNotes" class="w-full h-20 p-4 mt-1 rounded-lg border border-border-dark bg-surface-dark resize-none" placeholder="Optional notes..."></textarea></div>
                    </main>
                    <footer class="p-4 pb-8"><button id="saveExpenseBtn" class="w-full h-12 bg-primary text-white font-bold rounded-xl flex items-center justify-center gap-2"><span class="material-symbols-outlined">save</span> Save</button></footer>
                </div>`;
            },
            async initAddExpense() {
                const catSelect = document.getElementById('manualCategory');
                getL1Categories().forEach(c => { const o = document.createElement('option'); o.value = c.id; o.textContent = c.name; catSelect.appendChild(o); });

                document.getElementById('saveExpenseBtn').onclick = async () => {
                    const amount = parseFloat(document.getElementById('manualAmount').value) || 0;
                    if (!amount) { alert('Enter amount'); return; }
                    const type = document.getElementById('manualType').value;
                    const data = {
                        Date: document.getElementById('manualDate').value,
                        Details: document.getElementById('manualDetails').value || 'Manual entry',
                        Debit: type === 'Debit' ? amount : null,
                        Credit: type === 'Credit' ? amount : null,
                        Account_name: document.getElementById('manualAccount').value || 'Cash',
                        Account_type: document.getElementById('manualAccountType').value,
                        l1_category_id: catSelect.value || null,
                        Notes: document.getElementById('manualNotes').value || null,
                    };
                    try { const r = await api.createTransaction(data); if (r.success) { alert('Saved!'); router.navigate('home'); } else alert(r.detail || 'Failed'); } catch (e) { alert(e.message); }
                };
            },

            // ─── Categories ───────────────────────────────────────────────────
            categoriesScreen() {
                return `
                <div class="flex flex-col min-h-screen pb-16">
                    <header class="flex items-center justify-between p-4 border-b border-border-dark">
                        <h1 class="text-lg font-bold">Categories</h1>
                        <button onclick="screens.openCategoryModal()" class="flex items-center gap-1 h-8 px-3 rounded-lg bg-primary text-white text-sm font-semibold">
                            <span class="material-symbols-outlined text-lg">add</span> Add
                        </button>
                    </header>
                    <main id="categoriesList" class="flex-1 p-4 space-y-3 pb-20"><div class="flex justify-center py-8"><div class="size-8 border-2 border-primary/30 border-t-primary rounded-full animate-spin"></div></div></main>
                    ${this.renderNav('categories')}

                    <!-- Category Modal -->
                    <div id="categoryModal" class="fixed inset-0 bg-black/60 items-center justify-center z-50 hidden">
                        <div class="bg-surface-dark rounded-xl p-6 w-[90%] max-w-md border border-border-dark">
                            <h2 id="catModalTitle" class="text-lg font-bold mb-4">Add Category</h2>
                            <div class="space-y-3">
                                <div><label class="text-xs text-text-secondary">Name</label><input id="catModalName" type="text" placeholder="Category name" class="w-full h-10 px-3 mt-1 rounded-lg bg-background-dark border border-border-dark" /></div>
                                <div><label class="text-xs text-text-secondary">Level</label>
                                    <select id="catModalLevel" class="w-full h-10 px-3 mt-1 rounded-lg bg-background-dark border border-border-dark text-sm">
                                        <option value="1">L1 - Main Category</option>
                                        <option value="2">L2 - Sub-category</option>
                                    </select>
                                </div>
                                <div id="catModalParentWrap" class="hidden"><label class="text-xs text-text-secondary">Parent (L1)</label>
                                    <select id="catModalParent" class="w-full h-10 px-3 mt-1 rounded-lg bg-background-dark border border-border-dark text-sm"></select>
                                </div>
                                <div><label class="text-xs text-text-secondary">Color</label><input id="catModalColor" type="color" value="#137fec" class="w-full h-10 mt-1 rounded-lg bg-background-dark border border-border-dark cursor-pointer" /></div>
                            </div>
                            <div class="flex gap-3 mt-5">
                                <button onclick="screens.closeCategoryModal()" class="flex-1 h-10 border border-border-dark rounded-lg font-bold text-sm">Cancel</button>
                                <button id="catModalSaveBtn" class="flex-1 h-10 bg-primary text-white rounded-lg font-bold text-sm">Save</button>
                            </div>
                        </div>
                    </div>
                </div>`;
            },
            _catEditId: null,
            async initCategories() {
                const list = document.getElementById('categoriesList');
                try {
                    await loadCategories();
                    const cats = getL1Categories();
                    if (!cats.length) { list.innerHTML = '<p class="text-center text-text-secondary py-8">No categories</p>'; return; }
                    list.innerHTML = cats.map(c => `
                        <div class="bg-surface-dark p-4 rounded-xl">
                            <div class="flex items-center gap-3 mb-2">
                                <div class="w-3 h-3 rounded-full shrink-0" style="background:${c.color_hex || '#666'}"></div>
                                <p class="font-bold flex-1">${c.name}</p>
                                <span class="text-xs text-text-secondary px-2 py-0.5 rounded bg-background-dark">${c.domain || ''}</span>
                                <button onclick="screens.openCategoryModal('${c.id}','${c.name.replace(/'/g, "\\'")}','${c.color_hex || ''}',1,null)" class="p-1 text-text-secondary hover:text-primary rounded"><span class="material-symbols-outlined text-lg">edit</span></button>
                                <button onclick="screens.handleDeleteCategory('${c.id}','${c.name.replace(/'/g, "\\'")}')" class="p-1 text-text-secondary hover:text-red-500 rounded"><span class="material-symbols-outlined text-lg">delete</span></button>
                            </div>
                            ${c.children && c.children.length ? `
                            <div class="ml-6 space-y-1.5 mt-2">
                                ${c.children.map(ch => `
                                <div class="flex items-center gap-2 group">
                                    <span class="text-xs px-2 py-1 rounded bg-background-dark text-text-secondary flex-1">${ch.name}</span>
                                    <button onclick="screens.openCategoryModal('${ch.id}','${ch.name.replace(/'/g, "\\'")}','${ch.color_hex || c.color_hex || ''}',2,'${c.id}')" class="p-0.5 text-text-secondary hover:text-primary opacity-0 group-hover:opacity-100 transition-opacity"><span class="material-symbols-outlined text-sm">edit</span></button>
                                    <button onclick="screens.handleDeleteCategory('${ch.id}','${ch.name.replace(/'/g, "\\'")}')" class="p-0.5 text-text-secondary hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity"><span class="material-symbols-outlined text-sm">delete</span></button>
                                </div>`).join('')}
                                <button onclick="screens.openCategoryModal(null,null,null,2,'${c.id}')" class="flex items-center gap-1 text-xs text-primary hover:underline mt-1 ml-2">
                                    <span class="material-symbols-outlined text-sm">add</span> Add sub-category
                                </button>
                            </div>` : `
                            <button onclick="screens.openCategoryModal(null,null,null,2,'${c.id}')" class="flex items-center gap-1 text-xs text-primary hover:underline ml-6 mt-1">
                                <span class="material-symbols-outlined text-sm">add</span> Add sub-category
                            </button>`}
                        </div>`).join('');
                } catch (e) { list.innerHTML = '<p class="text-center text-red-500 py-8">Failed to load</p>'; }
            },
            openCategoryModal(editId = null, name = null, color = null, level = 1, parentId = null) {
                this._catEditId = editId;
                const modal = document.getElementById('categoryModal');
                document.getElementById('catModalTitle').textContent = editId ? 'Edit Category' : 'Add Category';
                document.getElementById('catModalName').value = name || '';
                document.getElementById('catModalColor').value = color || '#137fec';
                const levelSelect = document.getElementById('catModalLevel');
                levelSelect.value = String(level);
                if (editId) levelSelect.disabled = true; else levelSelect.disabled = false;

                const parentWrap = document.getElementById('catModalParentWrap');
                const parentSelect = document.getElementById('catModalParent');

                const showParent = () => {
                    if (levelSelect.value === '2') {
                        parentWrap.classList.remove('hidden');
                        parentSelect.innerHTML = '';
                        getL1Categories().forEach(c => { const o = document.createElement('option'); o.value = c.id; o.textContent = c.name; parentSelect.appendChild(o); });
                        if (parentId) parentSelect.value = parentId;
                    } else { parentWrap.classList.add('hidden'); }
                };
                showParent();
                levelSelect.onchange = showParent;

                document.getElementById('catModalSaveBtn').onclick = () => this.saveCategoryModal();
                modal.classList.remove('hidden'); modal.classList.add('flex');
            },
            closeCategoryModal() {
                document.getElementById('categoryModal').classList.add('hidden');
                document.getElementById('categoryModal').classList.remove('flex');
                this._catEditId = null;
            },
            async saveCategoryModal() {
                const name = document.getElementById('catModalName').value.trim();
                if (!name) { alert('Enter a name'); return; }
                const color = document.getElementById('catModalColor').value;
                const level = parseInt(document.getElementById('catModalLevel').value);
                const parentId = level === 2 ? document.getElementById('catModalParent').value : null;

                try {
                    if (this._catEditId) {
                        await api.updateCategory(this._catEditId, { name, color_hex: color });
                    } else {
                        const data = { name, level, color_hex: color };
                        if (parentId) data.parent_id = parentId;
                        const l1 = getL1Categories().find(c => c.id === parentId);
                        if (l1) data.domain = l1.domain;
                        await api.createCategory(data);
                    }
                    this.closeCategoryModal();
                    await this.initCategories();
                } catch (e) { alert('Failed: ' + e.message); }
            },
            async handleDeleteCategory(id, name) {
                if (!confirm(`Delete "${name}"? This cannot be undone.`)) return;
                try { await api.deleteCategory(id); await this.initCategories(); } catch (e) { alert('Failed: ' + e.message); }
            },

            // ─── Settings ─────────────────────────────────────────────────────
            settings() {
                return `
                <div class="flex flex-col min-h-screen pb-16">
                    <header class="flex items-center p-4 border-b border-border-dark"><h1 class="text-lg font-bold">Settings</h1></header>
                    <main class="flex-1 p-4 space-y-4">
                        <div class="bg-surface-dark p-4 rounded-xl">
                            <button onclick="router.navigate('upload')" class="w-full flex items-center gap-4 p-3 rounded-lg hover:bg-gray-700"><span class="material-symbols-outlined text-primary">upload_file</span><div class="text-left"><p class="font-bold">Upload CSV</p><p class="text-sm text-text-secondary">Import bank statement</p></div></button>
                        </div>
                        <div class="bg-surface-dark p-4 rounded-xl">
                            <h3 class="font-bold mb-3 text-red-500">Danger Zone</h3>
                            <button id="clearBtn" class="w-full h-10 bg-red-900/30 text-red-500 font-bold rounded-lg">Clear All Transactions</button>
                        </div>
                    </main>
                    ${this.renderNav('settings')}
                </div>`;
            },
            initSettings() {
                document.getElementById('clearBtn').onclick = async () => {
                    if (!confirm('Delete ALL transactions? Cannot be undone.')) return;
                    try { const r = await api.clearTable('transactions'); alert(r.message); } catch (e) { alert(e.message); }
                };
            },

            // ─── Accounts ─────────────────────────────────────────────────────
            accounts() {
                return `
                <div class="flex flex-col min-h-screen pb-16">
                    <header class="flex items-center p-4 border-b border-border-dark"><h1 class="text-lg font-bold">Accounts</h1></header>
                    <main id="accountsList" class="flex-1 p-4 space-y-3"><div class="flex justify-center py-8"><div class="size-8 border-2 border-primary/30 border-t-primary rounded-full animate-spin"></div></div></main>
                    <footer class="p-4"><button onclick="screens.openAccountModal()" class="w-full h-12 bg-surface-dark border border-border-dark text-white font-bold rounded-xl flex items-center justify-center gap-2"><span class="material-symbols-outlined">add_circle</span> Add Account</button></footer>
                    ${this.renderNav('accounts')}
                    <div id="accountModal" class="fixed inset-0 bg-black/60 items-center justify-center z-50 hidden">
                        <div class="bg-surface-dark rounded-xl p-6 w-[90%] max-w-md border border-border-dark">
                            <h2 id="modalTitle" class="text-xl font-bold text-center mb-6">Add Account</h2>
                            <div class="space-y-4">
                                <div><label class="text-text-secondary text-sm">Initial amount</label><input id="accountAmount" type="number" step="0.01" value="0" class="w-full h-10 px-3 mt-1 rounded-lg bg-background-dark" /></div>
                                <div><label class="text-text-secondary text-sm">Name</label><input id="accountNameInput" type="text" placeholder="Account name" class="w-full h-10 px-3 mt-1 rounded-lg bg-background-dark" /></div>
                                <div><label class="text-text-secondary text-sm">Type</label>
                                    <div id="accountTypeButtons" class="flex flex-wrap gap-2 mt-1">
                                        <button data-type="SAVINGS" class="type-btn px-3 py-1.5 rounded-lg text-sm border border-border-dark">Savings</button>
                                        <button data-type="CURRENT" class="type-btn px-3 py-1.5 rounded-lg text-sm border border-border-dark">Current</button>
                                        <button data-type="CREDIT_CARD" class="type-btn px-3 py-1.5 rounded-lg text-sm border border-border-dark">Credit Card</button>
                                        <button data-type="CASH" class="type-btn px-3 py-1.5 rounded-lg text-sm border border-border-dark">Cash</button>
                                        <button data-type="WALLET" class="type-btn px-3 py-1.5 rounded-lg text-sm border border-border-dark">Wallet</button>
                                    </div>
                                </div>
                            </div>
                            <div class="flex gap-4 mt-6">
                                <button onclick="screens.closeAccountModal()" class="flex-1 h-10 border border-border-dark rounded-lg font-bold">Cancel</button>
                                <button onclick="screens.saveAccount()" class="flex-1 h-10 bg-primary rounded-lg font-bold text-white">Save</button>
                            </div>
                        </div>
                    </div>
                </div>`;
            },
            accountModalState: { editingId: null, selectedType: null },
            async initAccounts() {
                const list = document.getElementById('accountsList');
                try {
                    const data = await api.getAccounts();
                    if (!data.accounts.length) { list.innerHTML = '<p class="text-center text-text-secondary py-8">No accounts yet</p>'; return; }
                    list.innerHTML = data.accounts.map(a => `
                        <div class="bg-surface-dark p-4 rounded-xl flex items-center justify-between">
                            <div><p class="font-bold">${a.name}</p><p class="text-sm text-text-secondary">Balance: ₹${a.balance.toLocaleString('en-IN', {minimumFractionDigits: 2})}</p></div>
                            <button onclick="screens.deleteAccountById('${a.id}','${a.name.replace(/'/g, "\\'")}')" class="p-2 text-red-500 hover:bg-red-900/20 rounded-full"><span class="material-symbols-outlined">delete</span></button>
                        </div>`).join('');
                } catch (e) { list.innerHTML = '<p class="text-center text-red-500 py-8">Failed</p>'; }
            },
            openAccountModal(account = null) {
                this.accountModalState = { editingId: account?.id || null, selectedType: account?.account_type || null };
                document.getElementById('modalTitle').textContent = account ? 'Edit Account' : 'Add Account';
                document.getElementById('accountNameInput').value = account?.name || '';
                document.getElementById('accountAmount').value = account?.opening_balance || 0;
                document.querySelectorAll('.type-btn').forEach(btn => {
                    btn.classList.remove('bg-primary', 'text-white');
                    if (btn.dataset.type === this.accountModalState.selectedType) btn.classList.add('bg-primary', 'text-white');
                    btn.onclick = () => { document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('bg-primary', 'text-white')); btn.classList.add('bg-primary', 'text-white'); this.accountModalState.selectedType = btn.dataset.type; };
                });
                document.getElementById('accountModal').classList.remove('hidden'); document.getElementById('accountModal').classList.add('flex');
            },
            closeAccountModal() { document.getElementById('accountModal').classList.add('hidden'); document.getElementById('accountModal').classList.remove('flex'); },
            async saveAccount() {
                const name = document.getElementById('accountNameInput').value.trim();
                const amount = parseFloat(document.getElementById('accountAmount').value) || 0;
                const type = this.accountModalState.selectedType;
                if (!name) { alert('Enter name'); return; }
                if (!type) { alert('Select type'); return; }
                try {
                    const data = { name, account_type: type, opening_balance: amount, currency: 'INR' };
                    const r = this.accountModalState.editingId ? await api.updateAccount(this.accountModalState.editingId, data) : await api.createAccount(data);
                    if (r.success) { this.closeAccountModal(); this.initAccounts(); } else alert(r.detail || 'Failed');
                } catch (e) { alert(e.message); }
            },
            async deleteAccountById(id, name) {
                if (!confirm(`Delete "${name}"?`)) return;
                try { const r = await api.deleteAccount(id); if (r.success) this.initAccounts(); } catch (e) { alert(e.message); }
            },
        };

        router.render();
    </script>
</body>
</html>
