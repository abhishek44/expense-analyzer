<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
    <title>Expense Tracker</title>

    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                        "surface-dark": "#1c232d",
                        "surface-dark-2": "#232d3a",
                        "border-dark": "#2a3441",
                        "text-secondary": "#9dabb9"
                    },
                    fontFamily: { "display": ["Manrope", "sans-serif"] },
                },
            },
        }
    </script>
    <style>
        body { min-height: 100dvh; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .cat-dropdown { position: relative; }
        .cat-dropdown-menu {
            display: none; position: absolute; top: 100%; left: 0; right: 0;
            z-index: 50; max-height: 240px; overflow-y: auto;
            background: #1c232d; border: 1px solid #2a3441; border-radius: 8px;
            margin-top: 4px; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .cat-dropdown-menu.open { display: block; }
        .cat-dropdown-menu label {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 12px; cursor: pointer; font-size: 13px;
            transition: background 0.15s;
        }
        .cat-dropdown-menu label:hover { background: #232d3a; }
        .chart-card {
            background: linear-gradient(145deg, #1c232d, #1e2835);
            border: 1px solid #2a3441; border-radius: 12px; padding: 20px;
        }
        /* Pivot table */
        .pivot-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .pivot-table th { text-align: right; padding: 8px 12px; font-weight: 600; font-size: 11px;
            text-transform: uppercase; letter-spacing: 0.05em; color: #9dabb9; border-bottom: 2px solid #2a3441; }
        .pivot-table th:first-child { text-align: left; }
        .pivot-table td { padding: 6px 12px; border-bottom: 1px solid #2a344180; }
        .pivot-table td:not(:first-child) { text-align: right; font-variant-numeric: tabular-nums; }
        .pivot-l1 { cursor: pointer; transition: background 0.15s; }
        .pivot-l1:hover { background: #232d3a; }
        .pivot-l1 td { font-weight: 700; }
        .pivot-l2 { cursor: pointer; background: #161e28; transition: background 0.15s; }
        .pivot-l2:hover { background: #232d3a; }
        .pivot-l2 td { padding-left: 28px !important; font-weight: 400; color: #c5d0db; }
        .pivot-grand td { font-weight: 800; border-top: 2px solid #2a3441; border-bottom: none;
            padding-top: 10px; padding-bottom: 10px; }
        .pivot-hidden { display: none; }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark text-gray-900 dark:text-white font-display">
    <div id="app" class="min-h-screen flex flex-col"></div>

    <script>
        const API_BASE = '/api';
        const PAGE_SIZE = 100;

        Chart.defaults.color = '#9dabb9';
        Chart.defaults.borderColor = '#2a3441';
        Chart.defaults.font.family = 'Manrope, sans-serif';

        const CHART_COLORS = [
            '#137fec', '#22c55e', '#ef4444', '#eab308', '#a855f7',
            '#ec4899', '#06b6d4', '#f97316', '#84cc16', '#6366f1',
            '#14b8a6', '#f43f5e', '#8b5cf6', '#10b981', '#f59e0b'
        ];

        const appState = {
            filters: { status: '', filename: '', accountName: '', accountType: '', categories: [], l1CategoryId: '', l2CategoryId: '', dateFrom: '', dateTo: '', search: '' },
            currentRequestToken: 0,
            loadedTransactions: [],
            totalTransactions: 0,
            currentSkip: 0,
            categories: [], // cached categories
            analyticsCharts: {},
            analyticsMeta: null,
        };

        const api = {
            async uploadCSV(file, accountName) {
                const formData = new FormData();
                formData.append('file', file);
                if (accountName) formData.append('account_name', accountName);
                const res = await fetch(`${API_BASE}/upload-csv`, { method: 'POST', body: formData });
                return res.json();
            },
            async getTransactions(status, filename, accountName, accountType, l1CategoryId, skip, limit, dateFrom, dateTo, search, l2CategoryId, categories) {
                let url = `${API_BASE}/transactions?skip=${skip || 0}&limit=${limit || PAGE_SIZE}`;
                if (status) url += `&status_filter=${encodeURIComponent(status)}`;
                if (filename) url += `&filename_filter=${encodeURIComponent(filename)}`;
                if (accountName) url += `&account_name=${encodeURIComponent(accountName)}`;
                if (accountType) url += `&account_type=${encodeURIComponent(accountType)}`;
                if (l1CategoryId) url += `&l1_category_id=${encodeURIComponent(l1CategoryId)}`;
                if (l2CategoryId) url += `&l2_category_id=${encodeURIComponent(l2CategoryId)}`;
                if (dateFrom) url += `&date_from=${encodeURIComponent(dateFrom)}`;
                if (dateTo) url += `&date_to=${encodeURIComponent(dateTo)}`;
                if (search) url += `&search=${encodeURIComponent(search)}`;
                if (categories) url += `&categories=${encodeURIComponent(categories)}`;
                const res = await fetch(url);
                return res.json();
            },
            async getTransaction(id) { return (await fetch(`${API_BASE}/transactions/${id}`)).json(); },
            async reviewTransaction(id, data) {
                return (await fetch(`${API_BASE}/transactions/${id}/review`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data)
                })).json();
            },
            async deleteTransaction(id) { return (await fetch(`${API_BASE}/transactions/${id}`, { method: 'DELETE' })).json(); },
            async getFilterOptions() { return (await fetch(`${API_BASE}/filter-options`)).json(); },
            async getTables() { return (await fetch(`${API_BASE}/tables`)).json(); },
            async getUploadedFiles() { return (await fetch(`${API_BASE}/uploaded-files`)).json(); },
            async deleteFile(filename) { return (await fetch(`${API_BASE}/uploaded-files/${encodeURIComponent(filename)}`, { method: 'DELETE' })).json(); },
            async clearTable(name) { return (await fetch(`${API_BASE}/tables/${name}/clear`, { method: 'DELETE' })).json(); },
            async createTransaction(data) {
                return (await fetch(`${API_BASE}/transactions`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })).json();
            },
            async getAccounts() { return (await fetch(`${API_BASE}/accounts`)).json(); },
            async createAccount(data) { return (await fetch(`${API_BASE}/accounts`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })).json(); },
            async updateAccount(id, data) { return (await fetch(`${API_BASE}/accounts/${id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })).json(); },
            async deleteAccount(id) { return (await fetch(`${API_BASE}/accounts/${id}`, { method: 'DELETE' })).json(); },
            async getCategories() { return (await fetch(`${API_BASE}/categories`)).json(); },
            async createCategory(data) { return (await fetch(`${API_BASE}/categories`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })).json(); },
            async updateCategory(id, data) { return (await fetch(`${API_BASE}/categories/${id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })).json(); },
            async deleteCategory(id) { const r = await fetch(`${API_BASE}/categories/${id}`, { method: 'DELETE' }); return r.status === 204 ? { success: true } : r.json(); },
            async getMerchantSuggestion(id) { return (await fetch(`${API_BASE}/merchant-suggestion/${id}`)).json(); },
            async getAnalyticsDashboard(dateFrom, dateTo, accountType, categories) {
                let url = `${API_BASE}/analytics/dashboard?`;
                if (dateFrom) url += `date_from=${encodeURIComponent(dateFrom)}&`;
                if (dateTo) url += `date_to=${encodeURIComponent(dateTo)}&`;
                if (accountType) url += `account_type=${encodeURIComponent(accountType)}&`;
                if (categories && categories.length) url += `categories=${encodeURIComponent(categories.join(','))}&`;
                return (await fetch(url)).json();
            }
        };

        // Load categories on startup
        async function loadCategories() {
            try { appState.categories = await api.getCategories(); } catch (e) { console.error(e); }
        }
        loadCategories();

        function getL1Categories() { return appState.categories; }
        function getL2Children(l1Id) {
            const cat = appState.categories.find(c => c.id === l1Id);
            return cat ? (cat.children || []) : [];
        }

        function esc(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }
        function fmt(n) {
            return '\u20B9' + Math.abs(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        function fmtMonth(m) {
            const [y, mo] = m.split('-');
            const names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            return names[parseInt(mo) - 1] + ' ' + y.slice(2);
        }
        function generateMonthOptions(years) {
            const months = [];
            const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
            for (const y of [...years].sort()) {
                for (let m = 1; m <= 12; m++) {
                    months.push({ value: `${y}-${String(m).padStart(2,'0')}`, label: `${monthNames[m-1]} ${y}` });
                }
            }
            return months;
        }

        const router = {
            currentRoute: 'home', params: {},
            navigate(route, params = {}) { this.currentRoute = route; this.params = params; this.render(); },
            render() {
                const app = document.getElementById('app');
                switch (this.currentRoute) {
                    case 'home': app.innerHTML = screens.home(); screens.initHome(); break;
                    case 'upload': app.innerHTML = screens.upload(); screens.initUpload(); break;
                    case 'records': app.innerHTML = screens.records(); screens.initRecords(); break;
                    case 'analytics': app.innerHTML = screens.analytics(); screens.initAnalytics(); break;
                    case 'budgets': app.innerHTML = screens.budgets(); screens.initBudgets(); break;
                    case 'details': app.innerHTML = screens.details(this.params.id); screens.initDetails(this.params.id); break;
                    case 'addExpense': app.innerHTML = screens.addExpense(); screens.initAddExpense(); break;
                    case 'settings': app.innerHTML = screens.settings(); screens.initSettings(); break;
                    case 'accounts': app.innerHTML = screens.accounts(); screens.initAccounts(); break;
                    case 'categories': app.innerHTML = screens.categoriesScreen(); screens.initCategories(); break;
                }
            }
        };

        const screens = {
            renderNav(active) {
                const navItem = (route, icon, label) => `
                    <button onclick="router.navigate('${route}')" class="flex flex-col items-center p-2 ${active === route ? 'text-primary' : 'text-text-secondary hover:text-primary'}">
                        <span class="material-symbols-outlined">${icon}</span>
                        <span class="text-xs mt-1">${label}</span>
                    </button>`;
                return `
                <nav class="fixed bottom-0 left-0 right-0 bg-surface-dark border-t border-border-dark z-50">
                    <div class="flex justify-around py-2 max-w-6xl mx-auto">
                        ${navItem('home', 'home', 'Home')}
                        ${navItem('records', 'receipt_long', 'Records')}
                        ${navItem('accounts', 'account_balance', 'Accounts')}
                        ${navItem('categories', 'category', 'Categories')}
                        ${navItem('analytics', 'insights', 'Analytics')}
                        ${navItem('budgets', 'savings', 'Budgets')}
                    </div>
                </nav>`;
            },

            // ─── Home ─────────────────────────────────────────────────────────
            home() {
                return `
                <div class="flex flex-col min-h-screen pb-16 max-w-6xl mx-auto w-full">
                    <header class="flex items-center justify-between p-4 border-b border-border-dark">
                        <h1 class="text-xl font-bold">Expense Tracker</h1>
                        <div class="flex items-center gap-2">
                            <button onclick="router.navigate('settings')" class="p-2 rounded-lg bg-surface-dark hover:bg-gray-700 text-text-secondary hover:text-white border border-border-dark flex items-center justify-center transition-colors" title="Settings">
                                <span class="material-symbols-outlined text-lg">settings</span>
                            </button>
                            <button onclick="router.navigate('upload')" class="flex items-center gap-1 h-9 px-3 rounded-lg bg-surface-dark hover:bg-gray-700 text-white text-sm font-semibold border border-border-dark">
                                <span class="material-symbols-outlined text-lg">upload_file</span><span>Upload</span>
                            </button>
                            <button onclick="screens.exportReviewed()" class="flex items-center gap-1 h-9 px-3 rounded-lg bg-green-600 hover:bg-green-700 text-white text-sm font-semibold">
                                <span class="material-symbols-outlined text-lg">download</span><span>Export</span>
                            </button>
                        </div>
                    </header>
                    <main class="flex-1 p-4 space-y-5">
                        <div id="statsGrid" class="grid grid-cols-2 gap-3">
                            <div class="bg-surface-dark p-4 rounded-xl border border-border-dark"><p class="text-text-secondary text-sm font-medium">Pending Review</p><p id="statPending" class="text-2xl font-extrabold text-yellow-500 mt-1">-</p></div>
                            <div class="bg-surface-dark p-4 rounded-xl border border-border-dark"><p class="text-text-secondary text-sm font-medium">Reviewed</p><p id="statReviewed" class="text-2xl font-extrabold text-green-500 mt-1">-</p></div>
                        </div>

                        <!-- Uploaded Files Section -->
                        <div class="space-y-3">
                            <div class="flex items-center justify-between">
                                <h2 class="text-lg font-bold">Uploaded Statement Files</h2>
                                <button onclick="router.navigate('upload')" class="text-xs text-primary font-bold hover:underline">+ Upload New</button>
                            </div>
                            <div id="homeFilesList" class="space-y-3">
                                <div class="flex justify-center py-8"><div class="size-8 border-2 border-primary/30 border-t-primary rounded-full animate-spin"></div></div>
                            </div>
                        </div>
                    </main>
                    ${this.renderNav('home')}
                </div>`;
            },
            async initHome() {
                try {
                    const data = await api.getTables();
                    const t = data.tables.find(t => t.name === 'transactions');
                    if (t) { document.getElementById('statPending').textContent = t.pending || 0; document.getElementById('statReviewed').textContent = t.reviewed || 0; }
                } catch (e) { console.error(e); }

                const filesList = document.getElementById('homeFilesList');
                try {
                    const data = await api.getUploadedFiles();
                    if (!data.files || !data.files.length) {
                        filesList.innerHTML = '<div class="bg-surface-dark p-6 rounded-xl border border-border-dark text-center text-text-secondary"><p class="text-sm">No statement files uploaded yet</p></div>';
                        return;
                    }
                    filesList.innerHTML = data.files.map(f => `
                        <div class="bg-surface-dark p-4 rounded-xl border border-border-dark">
                            <div class="flex justify-between items-start mb-2">
                                <div class="flex items-center gap-2 truncate flex-1 pr-2">
                                    <span class="material-symbols-outlined text-primary">description</span>
                                    <p class="font-bold truncate">${f.filename}</p>
                                </div>
                                <button onclick="screens.deleteFileHome('${f.filename.replace(/'/g, "\\'")}')" class="p-1 text-text-secondary hover:text-red-500 rounded"><span class="material-symbols-outlined text-lg">delete</span></button>
                            </div>
                            <div class="flex items-center gap-4 text-xs font-semibold mb-3">
                                <span class="px-2.5 py-1 rounded bg-yellow-900/30 text-yellow-400">${f.pending_count} pending</span>
                                <span class="px-2.5 py-1 rounded bg-green-900/30 text-green-400">${f.reviewed_count} reviewed</span>
                            </div>
                            <button onclick="screens.viewFileRecords('${f.filename.replace(/'/g, "\\'")}')" class="w-full h-9 bg-primary/20 hover:bg-primary/30 text-primary font-bold text-sm rounded-lg border border-primary/40 flex items-center justify-center gap-1 transition-colors">
                                <span class="material-symbols-outlined text-sm">visibility</span> View Transactions
                            </button>
                        </div>`).join('');
                } catch (e) { filesList.innerHTML = '<p class="text-center text-red-500 py-4">Failed to load files</p>'; }
            },
            viewFileRecords(filename) {
                appState.filters.filename = filename;
                router.navigate('records');
            },
            async deleteFileHome(filename) {
                if (!confirm(`Delete all records for "${filename}"?`)) return;
                try { const r = await api.deleteFile(filename); if (r.success) { this.initHome(); } } catch (e) { alert(e.message); }
            },
            async exportReviewed() {
                try {
                    const res = await fetch(`${API_BASE}/export-transactions`);
                    if (!res.ok) { alert((await res.json()).detail || 'Export failed'); return; }
                    const blob = await res.blob();
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a'); a.href = url;
                    a.download = res.headers.get('Content-Disposition')?.split('filename=')[1] || 'transactions.csv';
                    document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
                } catch (e) { alert('Export failed: ' + e.message); }
            },

            // ─── Upload CSV ───────────────────────────────────────────────────
            upload() {
                return `
                <div class="flex flex-col min-h-screen max-w-6xl mx-auto w-full">
                    <header class="flex items-center p-4 border-b border-border-dark">
                        <button onclick="router.navigate('home')" class="p-2 -ml-2 rounded-full hover:bg-gray-700"><span class="material-symbols-outlined">arrow_back</span></button>
                        <h1 class="text-lg font-bold ml-2">Upload CSV</h1>
                    </header>
                    <main class="flex-1 p-4 space-y-4">
                        <div><label class="block text-sm font-medium mb-2">Account Name</label><input id="accountName" type="text" placeholder="e.g. HDFC 1234" class="w-full h-12 px-4 rounded-lg border border-border-dark bg-surface-dark" /></div>
                        <div id="dropZone" class="flex flex-col items-center gap-4 rounded-xl border-2 border-dashed border-border-dark p-8 cursor-pointer hover:border-primary">
                            <span class="material-symbols-outlined text-4xl text-primary">cloud_upload</span>
                            <p class="font-bold">Upload CSV File</p>
                            <p class="text-sm text-text-secondary">Tap to browse or drag file here</p>
                            <input type="file" id="fileInput" accept=".csv" class="hidden" />
                        </div>
                        <div id="uploadProgress" class="hidden bg-surface-dark p-4 rounded-xl">
                            <div class="flex items-center gap-4"><div class="size-8 border-2 border-primary/30 border-t-primary rounded-full animate-spin"></div><div><p class="font-bold">Uploading...</p><p id="uploadFileName" class="text-sm text-text-secondary"></p></div></div>
                        </div>
                    </main>
                </div>`;
            },
            initUpload() {
                const dz = document.getElementById('dropZone'), fi = document.getElementById('fileInput');
                dz.onclick = () => fi.click();
                dz.ondragover = e => { e.preventDefault(); dz.classList.add('border-primary'); };
                dz.ondragleave = () => dz.classList.remove('border-primary');
                dz.ondrop = e => { e.preventDefault(); if (e.dataTransfer.files[0]) this.handleUpload(e.dataTransfer.files[0]); };
                fi.onchange = e => { if (e.target.files[0]) this.handleUpload(e.target.files[0]); };
            },
            async handleUpload(file) {
                document.getElementById('uploadFileName').textContent = file.name;
                document.getElementById('dropZone').classList.add('hidden');
                document.getElementById('uploadProgress').classList.remove('hidden');
                try {
                    const result = await api.uploadCSV(file, document.getElementById('accountName').value);
                    if (result.success) { alert(`Uploaded ${result.rows_inserted} rows`); router.navigate('home'); }
                    else { alert('Failed: ' + (result.detail || 'Unknown')); document.getElementById('dropZone').classList.remove('hidden'); document.getElementById('uploadProgress').classList.add('hidden'); }
                } catch (e) { alert('Failed: ' + e.message); document.getElementById('dropZone').classList.remove('hidden'); document.getElementById('uploadProgress').classList.add('hidden'); }
            },

            // ─── Records Screen ───────────────────────────────────────────────
            records() {
                const { status, search, filename } = appState.filters;
                return `
                <div class="flex flex-col min-h-screen pb-16 max-w-6xl mx-auto w-full">
                    <header class="sticky top-0 z-20 bg-background-dark border-b border-border-dark space-y-3 p-4">
                        <div class="flex items-center justify-between gap-2">
                            <div class="flex items-center gap-2">
                                <h1 class="text-lg font-bold truncate">${filename ? 'File: ' + filename : 'Records'}</h1>
                                ${filename ? `<button onclick="appState.filters.filename=''; screens.initRecords();" class="text-xs text-primary font-bold hover:underline">(Show All)</button>` : ''}
                            </div>
                            <div id="recFyButtons" class="flex gap-1.5 flex-wrap"></div>
                        </div>

                        <!-- Search bar -->
                        <div class="relative">
                            <span class="material-symbols-outlined absolute left-3 top-2.5 text-text-secondary text-xl">search</span>
                            <input id="recSearchInput" type="text" value="${search || ''}" placeholder="Search transaction details, raw text, notes..."
                                class="w-full h-10 pl-10 pr-4 rounded-lg bg-surface-dark border border-border-dark text-sm"
                                oninput="screens.onRecordsSearchInput(this.value)" />
                        </div>

                        <!-- Global Filters -->
                        <div class="flex flex-wrap gap-2 items-end">
                            <div class="flex-1 min-w-[120px]">
                                <label class="text-xs text-text-secondary block mb-1">From</label>
                                <select id="recDateFrom" onchange="screens.onRecordsFilterChange()"
                                    class="w-full h-8 px-2 rounded-lg bg-surface-dark border border-border-dark text-xs"></select>
                            </div>
                            <div class="flex-1 min-w-[120px]">
                                <label class="text-xs text-text-secondary block mb-1">To</label>
                                <select id="recDateTo" onchange="screens.onRecordsFilterChange()"
                                    class="w-full h-8 px-2 rounded-lg bg-surface-dark border border-border-dark text-xs"></select>
                            </div>
                            <div class="flex-1 min-w-[160px]">
                                <label class="text-xs text-text-secondary block mb-1">Account</label>
                                <div class="flex h-8 rounded-lg overflow-hidden border border-border-dark">
                                    <button onclick="screens.setRecAccountType('')" id="recAccAll" class="rec-acc-btn flex-1 text-xs font-semibold px-2">All</button>
                                    <button onclick="screens.setRecAccountType('Savings')" id="recAccSavings" class="rec-acc-btn flex-1 text-xs font-semibold px-2 border-x border-border-dark">Savings</button>
                                    <button onclick="screens.setRecAccountType('CreditCard')" id="recAccCC" class="rec-acc-btn flex-1 text-xs font-semibold px-2">Credit Card</button>
                                </div>
                            </div>
                            <div class="flex-1 min-w-[140px] cat-dropdown">
                                <label class="text-xs text-text-secondary block mb-1">Category</label>

            renderPivotTable(pivotData, grandTotal, accountTypes = ['Savings', 'CreditCard']) {
                appState.currentPivotData = pivotData;
                const table = document.getElementById('pivotTable');
                if (!table) return;

                const fmtCell = (v) => '\u20B9' + Math.abs(v || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
                const diffColor = (v) => (v || 0) > 0 ? 'text-green-400' : (v || 0) < 0 ? 'text-red-400' : 'text-text-secondary';

                const accountHeader = accountTypes.map(type => `<th colspan="2" class="text-center border-l border-border-dark">${type}</th>`).join('');
                const valueHeader = accountTypes.map(() => `<th class="amount border-l border-border-dark">Debit</th><th class="amount">Credit</th>`).join('');

                let html = `
                    <thead>
                        <tr>
                            <th rowspan="2" class="text-left">Row Labels</th>
                            ${accountHeader}
                            <th rowspan="2" class="amount border-l border-border-dark">Total Debit</th>
                            <th rowspan="2" class="amount">Total Credit</th>
                            <th rowspan="2" class="amount">Difference</th>
                        </tr>
                        <tr>
                            ${valueHeader}
                        </tr>
                    </thead>
                    <tbody>`;

                pivotData.forEach((l1, idx) => {
                    const hasChildren = l1.children && l1.children.length > 0;
                    const accountCells = accountTypes.map(type => {
                        const vals = (l1.by_account && l1.by_account[type]) || { debit: 0, credit: 0 };
                        return `<td class="amount text-red-400/90 border-l border-border-dark">${fmtCell(vals.debit)}</td><td class="amount text-green-400/90">${fmtCell(vals.credit)}</td>`;
                    }).join('');

                    html += `
                        <tr class="pivot-l1" onclick="screens.togglePivotChildren(${idx})">
                            <td class="text-left font-bold">
                                ${hasChildren ? `<span class="material-symbols-outlined text-sm align-middle mr-1 pivot-arrow" id="pivotArrow${idx}" style="font-size:16px;transition:transform 0.2s">chevron_right</span>` : '<span style="display:inline-block;width:20px"></span>'}
                                ${l1.name}
                            </td>
                            ${accountCells}
                            <td class="amount text-red-400 font-bold border-l border-border-dark">${fmtCell(l1.total_debit)}</td>
                            <td class="amount text-green-400 font-bold">${fmtCell(l1.total_credit)}</td>
                            <td class="amount font-bold ${diffColor(l1.difference)}">${l1.difference >= 0 ? '' : '-'}${fmtCell(l1.difference)}</td>
                        </tr>`;

                    if (hasChildren) {
                        l1.children.forEach((l2, l2Idx) => {
                            const childAccCells = accountTypes.map(type => {
                                const vals = (l2.by_account && l2.by_account[type]) || { debit: 0, credit: 0 };
                                return `<td class="amount border-l border-border-dark">${fmtCell(vals.debit)}</td><td class="amount">${fmtCell(vals.credit)}</td>`;
                            }).join('');

                            html += `
                                <tr class="pivot-l2 pivot-hidden pivot-child-${idx}" onclick="screens.openPivotDrillDown(${idx}, ${l2Idx})">
                                    <td class="text-left pl-8">${l2.name}</td>
                                    ${childAccCells}
                                    <td class="amount text-red-400/90 border-l border-border-dark">${fmtCell(l2.total_debit)}</td>
                                    <td class="amount text-green-400/90">${fmtCell(l2.total_credit)}</td>
                                    <td class="amount ${diffColor(l2.difference)}">${l2.difference >= 0 ? '' : '-'}${fmtCell(l2.difference)}</td>
                                </tr>`;
                        });
                    }
                });

                const grandAccCells = accountTypes.map(type => {
                    const vals = (grandTotal.by_account && grandTotal.by_account[type]) || { debit: 0, credit: 0 };
                    return `<td class="amount text-red-400 border-l border-border-dark">${fmtCell(vals.debit)}</td><td class="amount text-green-400">${fmtCell(vals.credit)}</td>`;
                }).join('');

                html += `
                    <tr class="pivot-grand border-t-2 border-border-dark font-extrabold bg-surface-dark-2">
                        <td class="text-left">Grand Total</td>
                        ${grandAccCells}
                        <td class="amount text-red-400 border-l border-border-dark">${fmtCell(grandTotal.total_debit)}</td>
                        <td class="amount text-green-400">${fmtCell(grandTotal.total_credit)}</td>
                        <td class="amount ${diffColor(grandTotal.difference)}">${grandTotal.difference >= 0 ? '' : '-'}${fmtCell(grandTotal.difference)}</td>
                    </tr>`;

                html += '</tbody>';
                table.innerHTML = html;
            },
            togglePivotChildren(idx) {
                const rows = document.querySelectorAll(`.pivot-child-${idx}`);
                const arrow = document.getElementById(`pivotArrow${idx}`);
                const isHidden = rows[0]?.classList.contains('pivot-hidden');
                rows.forEach(r => r.classList.toggle('pivot-hidden', !isHidden));
                if (arrow) arrow.style.transform = isHidden ? 'rotate(90deg)' : '';
            },
            async openPivotDrillDown(l1Idx, l2Idx) {
                const modal = document.getElementById('pivotModal');
                const title = document.getElementById('pivotModalTitle');
                const subtitle = document.getElementById('pivotModalSubtitle');
                const list = document.getElementById('pivotModalList');

                const l1Obj = appState.currentPivotData ? appState.currentPivotData[l1Idx] : null;
                const l2Obj = l1Obj && l1Obj.children ? l1Obj.children[l2Idx] : null;
                const l1Name = l1Obj ? l1Obj.name : '';
                const l2Name = l2Obj ? l2Obj.name : '';

                title.textContent = `${l1Name} > ${l2Name}`;
                subtitle.textContent = `Filtered transactions`;
                list.innerHTML = '<div class="flex justify-center py-8"><div class="size-8 border-2 border-primary/30 border-t-primary rounded-full animate-spin"></div></div>';

                modal.classList.remove('hidden');
                modal.classList.add('flex');

                if (!appState.categories || !appState.categories.length) {
                    try { appState.categories = await api.getCategories(); } catch (e) {}
                }
                let l1CatId = null;
                let l2CatId = null;
                const l1Cat = (appState.categories || []).find(c => c.name === l1Name);
                if (l1Cat) {
                    l1CatId = l1Cat.id;
                    if (l1Cat.children && l2Name) {
                        const l2Cat = l1Cat.children.find(c => c.name === l2Name);
                        if (l2Cat) l2CatId = l2Cat.id;
                    }
                }

                try {
                    const { dateFrom, dateTo, accountType } = appState.filters;
                    const res = await api.getTransactions(null, null, null, accountType, l1CatId, 0, 200, dateFrom, dateTo, null, l2CatId);
                    const txns = res.data || [];

                    if (!txns.length) {
                        list.innerHTML = '<p class="text-center text-text-secondary py-8">No matching transactions found</p>';
                        return;
                    }

                    list.innerHTML = txns.map(t => {
                        const name = t.merchant_name || t.cleaned_details || t.raw_details || 'Transaction';
                        const subtitleText = [t.flow_direction, t.account_name].filter(Boolean).join(' • ');
                        const amtStr = t.debit ? `- ₹${t.debit.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}` : t.credit ? `+ ₹${t.credit.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}` : '₹0.00';
                        const amtClass = t.debit ? 'text-red-400' : t.credit ? 'text-green-400' : 'text-gray-300';
                        return `
                        <div onclick="screens.closePivotModal(); router.navigate('details', {id: ${t.id}})"
                            class="bg-background-dark p-3.5 rounded-xl cursor-pointer hover:border-primary/50 border border-border-dark flex items-center justify-between transition-all">
                            <div class="flex-1 min-w-0 mr-3">
                                <p class="font-bold text-sm truncate capitalize">${esc(name)}</p>
                                ${subtitleText ? `<p class="text-xs text-text-secondary truncate mt-0.5">${esc(subtitleText)}</p>` : ''}
                                <p class="text-xs text-gray-400 mt-1">${esc(t.parsed_date || t.raw_date || '')}</p>
                            </div>
                            <div class="text-right shrink-0">
                                <p class="text-sm font-bold ${amtClass}">${amtStr}</p>
                                <span class="px-2 py-0.5 rounded text-[10px] font-bold ${t.review_status !== 'pending' ? 'bg-green-900/30 text-green-400' : 'bg-yellow-900/30 text-yellow-400'} mt-1 inline-block">${esc(t.review_status)}</span>
                            </div>
                        </div>`;
                    }).join('');
                } catch (e) {
                    list.innerHTML = `<p class="text-center text-red-500 py-8">Failed to load transactions: ${e.message}</p>`;
                }
            },
            closePivotModal() {
                const modal = document.getElementById('pivotModal');
                if (modal) { modal.classList.add('hidden'); modal.classList.remove('flex'); }
            },

                            </div>
                        </div>
                    </main>

                    <!-- Budget Edit/Create Modal -->
                    <div id="budgetModal" class="fixed inset-0 bg-black/60 items-center justify-center z-50 hidden">
                        <div class="bg-surface-dark rounded-xl p-6 w-[90%] max-w-md border border-border-dark">
                            <h2 id="budgetModalTitle" class="text-lg font-bold mb-4">Edit Budget</h2>
                            <div class="space-y-4">
                                <div id="budgetL1SelectWrap">
                                    <label class="text-xs text-text-secondary">L1 Category</label>
                                    <select id="budgetL1Name" class="w-full h-10 px-3 mt-1 rounded-lg bg-background-dark border border-border-dark text-sm"></select>
                                </div>
                                <div id="budgetL1StaticWrap">
                                    <label class="text-xs text-text-secondary">L1 Category</label>
                                    <p id="budgetL1StaticName" class="text-sm font-bold mt-1 px-3 py-2 bg-background-dark rounded-lg border border-border-dark"></p>
                                </div>
                                <div>
                                    <label class="text-xs text-text-secondary">Amount Limit (₹)</label>
                                    <input id="budgetAmountLimit" type="number" step="0.01" class="w-full h-10 px-3 mt-1 rounded-lg bg-background-dark border border-border-dark text-sm" />
                                </div>
                                <div>
                                    <label class="text-xs text-text-secondary">Period</label>
                                    <select id="budgetPeriod" class="w-full h-10 px-3 mt-1 rounded-lg bg-background-dark border border-border-dark text-sm">
                                        <option value="MONTHLY">Monthly</option>
                                        <option value="WEEKLY">Weekly</option>
                                        <option value="YEARLY">Yearly</option>
                                    </select>
                                </div>
                                <div class="flex items-center justify-between">
                                    <label class="text-sm font-medium">Rollover unused budget</label>
                                    <input id="budgetRollover" type="checkbox" class="rounded border-border-dark bg-background-dark text-primary" />
                                </div>
                                <div class="flex items-center justify-between">
                                    <label class="text-sm font-medium">Active</label>
                                    <input id="budgetIsActive" type="checkbox" checked class="rounded border-border-dark bg-background-dark text-primary" />
                                </div>
                            </div>
                            <div class="flex gap-3 mt-6">
                                <button onclick="screens.closeBudgetModal()" class="flex-1 h-10 border border-border-dark rounded-lg font-bold text-sm">Cancel</button>
                                <button id="budgetSaveBtn" class="flex-1 h-10 bg-primary text-white rounded-lg font-bold text-sm">Save</button>
                            </div>
                        </div>
                    </div>

                    ${this.renderNav('budgets')}
                </div>`;
            },
            budgetState: { editingId: null, currentMonth: null, loadedProgress: [] },
            async initBudgets() {
                // Determine active month
                if (!this.budgetState.currentMonth) {
                    this.budgetState.currentMonth = new Date().toISOString().slice(0, 7);
                }

                // Load month dropdown
                try {
                    const dash = await api.getAnalyticsDashboard();
                    const years = dash.filters.available_years || [2026, 2025];
                    const months = generateMonthOptions(years);
                    const monthSel = document.getElementById('budgetMonthSelect');
                    if (monthSel) {
                        monthSel.innerHTML = months.reverse().map(m => `<option value="${m.value}">${m.label}</option>`).join('');
                        monthSel.value = this.budgetState.currentMonth;
                    }
                } catch (e) { console.error(e); }

                await this.loadBudgetsProgress();
            },
            onBudgetMonthChange() {
                this.budgetState.currentMonth = document.getElementById('budgetMonthSelect').value;
                this.loadBudgetsProgress();
            },
            async loadBudgetsProgress() {
                const monthlyList = document.getElementById('monthlyBudgetsList');
                const yearlyList = document.getElementById('yearlyBudgetsList');
                if (!monthlyList || !yearlyList) return;
                monthlyList.innerHTML = '<div class="flex justify-center py-8"><div class="size-8 border-2 border-primary/30 border-t-primary rounded-full animate-spin"></div></div>';
                yearlyList.innerHTML = '<div class="flex justify-center py-8"><div class="size-8 border-2 border-primary/30 border-t-primary rounded-full animate-spin"></div></div>';

                try {
                    const res = await fetch(`${API_BASE}/budgets/progress?month=${this.budgetState.currentMonth}`);
                    const data = await res.json();
                    this.budgetState.loadedProgress = data.progress || [];

                    document.getElementById('monthlyPeriodLabel').textContent = fmtMonth(data.month);
                    document.getElementById('yearlyPeriodLabel').textContent = data.fy_label;

                    if (!this.budgetState.loadedProgress.length) {
                        const emptyHtml = '<div class="bg-surface-dark p-6 rounded-xl border border-border-dark text-center text-text-secondary"><p>No budgets configured. Click Add to create one!</p></div>';
                        monthlyList.innerHTML = emptyHtml;
                        yearlyList.innerHTML = emptyHtml;
                        return;
                    }

                    // Render Monthly List
                    monthlyList.innerHTML = this.budgetState.loadedProgress.map((b, idx) => {
                        const m = b.monthly;
                        const progressPct = Math.min(m.percentage, 100);
                        // Progress bar colors: Green (<=50%), Orange (51%-80%), Red (>80%)
                        const barColorClass = m.percentage <= 50 ? 'bg-green-500' : m.percentage <= 80 ? 'bg-yellow-500' : 'bg-red-500';
                        const isOver = m.left_to_spend < 0;
                        const leftStr = isOver 
                            ? `₹${Math.abs(m.left_to_spend).toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})} overspent of ₹${m.amount_limit.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}` 
                            : `₹${m.left_to_spend.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})} left of ₹${m.amount_limit.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;

                        return `
                        <div class="bg-surface-dark rounded-xl border border-border-dark overflow-hidden transition-all text-left">
                            <div class="p-4 cursor-pointer hover:bg-surface-dark-2/40" onclick="screens.toggleBudgetL2('monthly', ${idx})">
                                <div class="flex justify-between items-start mb-2">
                                    <div>
                                        <h3 class="font-extrabold text-base flex items-center gap-1.5">
                                            ${b.l1_category_name}
                                            ${b.rollover ? '<span class="material-symbols-outlined text-xs text-primary" title="Rollover active">redo</span>' : ''}
                                        </h3>
                                        <p class="text-xs text-text-secondary mt-0.5">${leftStr}</p>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <div class="text-right">
                                            <p class="font-extrabold text-sm ${isOver ? 'text-red-400' : 'text-text-secondary'}">${m.percentage}%</p>
                                            <p class="text-[10px] text-text-secondary font-semibold uppercase tracking-wider">${b.period}</p>
                                        </div>
                                        <button onclick="event.stopPropagation(); screens.openEditBudgetModal(${b.id}, '${b.l1_category_name.replace(/'/g, "\\'")}', ${m.amount_limit}, ${b.rollover}, '${b.period}')"
                                            class="p-2 text-text-secondary hover:text-white rounded-lg hover:bg-surface-dark-2">
                                            <span class="material-symbols-outlined text-base">edit</span>
                                        </button>
                                    </div>
                                </div>
                                <div class="w-full bg-background-dark rounded-full h-2.5 overflow-hidden">
                                    <div class="h-full rounded-full ${barColorClass}" style="width: ${progressPct}%"></div>
                                </div>
                            </div>
                            
                            <!-- L2 Breakdown section -->
                            <div id="monthlyBudgetL2-${idx}" class="hidden border-t border-border-dark/50 bg-background-dark/30 px-4 py-3 space-y-1.5">
                                ${m.l2_breakdown.length ? m.l2_breakdown.map(l2 => `
                                    <div class="flex items-center justify-between text-xs font-semibold py-0.5">
                                        <span class="text-text-secondary">${l2.name}</span>
                                        <span>₹${l2.spend.toLocaleString('en-IN', {minimumFractionDigits:2})}</span>
                                    </div>
                                `).join('') : '<p class="text-xs text-text-secondary italic text-center py-1">No transaction data in this month</p>'}
                            </div>
                        </div>`;
                    }).join('');

                    // Sort Yearly list by yearly percentage spent (highest first)
                    const sortedYearlyProgress = [...this.budgetState.loadedProgress].sort((x, y) => y.yearly.percentage - x.yearly.percentage);

                    // Render Yearly List
                    yearlyList.innerHTML = sortedYearlyProgress.map((b, idx) => {
                        const y = b.yearly;
                        const progressPct = Math.min(y.percentage, 100);
                        // Progress bar colors: Green (<=50%), Orange (51%-80%), Red (>80%)
                        const barColorClass = y.percentage <= 50 ? 'bg-green-500' : y.percentage <= 80 ? 'bg-yellow-500' : 'bg-red-500';
                        const isOver = y.left_to_spend < 0;
                        const leftStr = isOver 
                            ? `₹${Math.abs(y.left_to_spend).toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})} overspent of ₹${y.amount_limit.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}` 
                            : `₹${y.left_to_spend.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})} left of ₹${y.amount_limit.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;

                        return `
                        <div class="bg-surface-dark rounded-xl border border-border-dark overflow-hidden transition-all text-left">
                            <div class="p-4 cursor-pointer hover:bg-surface-dark-2/40" onclick="screens.toggleBudgetL2('yearly', ${idx})">
                                <div class="flex justify-between items-start mb-2">
                                    <div>
                                        <h3 class="font-extrabold text-base flex items-center gap-1.5">
                                            ${b.l1_category_name}
                                        </h3>
                                        <p class="text-xs text-text-secondary mt-0.5">${leftStr}</p>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <div class="text-right">
                                            <p class="font-extrabold text-sm ${isOver ? 'text-red-400' : 'text-text-secondary'}">${y.percentage}%</p>
                                            <p class="text-[10px] text-text-secondary font-semibold uppercase tracking-wider">YEARLY</p>
                                        </div>
                                    </div>
                                </div>
                                <div class="w-full bg-background-dark rounded-full h-2.5 overflow-hidden">
                                    <div class="h-full rounded-full ${barColorClass}" style="width: ${progressPct}%"></div>
                                </div>
                            </div>
                            
                            <!-- L2 Breakdown section -->
                            <div id="yearlyBudgetL2-${idx}" class="hidden border-t border-border-dark/50 bg-background-dark/30 px-4 py-3 space-y-1.5">
                                ${y.l2_breakdown.length ? y.l2_breakdown.map(l2 => `
                                    <div class="flex items-center justify-between text-xs font-semibold py-0.5">
                                        <span class="text-text-secondary">${l2.name}</span>
                                        <span>₹${l2.spend.toLocaleString('en-IN', {minimumFractionDigits:2})}</span>
                                    </div>
                                `).join('') : '<p class="text-xs text-text-secondary italic text-center py-1">No transaction data in this year</p>'}
                            </div>
                        </div>`;
                    }).join('');

                } catch (e) {
                    monthlyList.innerHTML = `<p class="text-center text-red-500 py-8">Failed to load budget progress: ${e.message}</p>`;
                    yearlyList.innerHTML = `<p class="text-center text-red-500 py-8">Failed to load budget progress: ${e.message}</p>`;
                }
            },
            toggleBudgetL2(type, idx) {
                const block = document.getElementById(`${type}BudgetL2-${idx}`);
                if (block) block.classList.toggle('hidden');
            },
            openEditBudgetModal(id, l1Name, amountLimit, rollover, period) {
                this.budgetState.editingId = id;
                document.getElementById('budgetModalTitle').textContent = "Edit Budget Limit";
                document.getElementById('budgetL1SelectWrap').classList.add('hidden');
                document.getElementById('budgetL1StaticWrap').classList.remove('hidden');
                document.getElementById('budgetL1StaticName').textContent = l1Name;
                document.getElementById('budgetAmountLimit').value = amountLimit;
                document.getElementById('budgetPeriod').value = period;
                document.getElementById('budgetRollover').checked = rollover;
                document.getElementById('budgetIsActive').checked = true;

                document.getElementById('budgetSaveBtn').onclick = () => this.saveBudget();
                const modal = document.getElementById('budgetModal');
                modal.classList.remove('hidden'); modal.classList.add('flex');
            },
            async openNewBudgetModal() {
                this.budgetState.editingId = null;
                document.getElementById('budgetModalTitle').textContent = "Add Budget Limit";
                document.getElementById('budgetL1SelectWrap').classList.remove('hidden');
                document.getElementById('budgetL1StaticWrap').classList.add('hidden');
                
                // Populate L1 options not already configured
                const select = document.getElementById('budgetL1Name');
                select.innerHTML = '';
                
                const configured = this.budgetState.loadedProgress.map(p => p.l1_category_name);
                const l1Cats = getL1Categories();
                
                l1Cats.forEach(c => {
                    if (!configured.includes(c.name)) {
                        const opt = document.createElement('option');
                        opt.value = c.name; opt.textContent = c.name;
                        select.appendChild(opt);
                    }
                });

                if (!select.children.length) {
                    alert("All L1 categories already have active budget limits configured!");
                    return;
                }

                document.getElementById('budgetAmountLimit').value = '5000';
                document.getElementById('budgetPeriod').value = 'MONTHLY';
                document.getElementById('budgetRollover').checked = false;
                document.getElementById('budgetIsActive').checked = true;

                document.getElementById('budgetSaveBtn').onclick = () => this.saveBudget();
                const modal = document.getElementById('budgetModal');
                modal.classList.remove('hidden'); modal.classList.add('flex');
            },
            closeBudgetModal() {
                const modal = document.getElementById('budgetModal');
                modal.classList.add('hidden'); modal.classList.remove('flex');
                this.budgetState.editingId = null;
            },
            async saveBudget() {
                const amount = parseFloat(document.getElementById('budgetAmountLimit').value) || 0;
                if (amount <= 0) { alert('Enter valid amount greater than 0'); return; }
                const period = document.getElementById('budgetPeriod').value;
                const rollover = document.getElementById('budgetRollover').checked;
                const isActive = document.getElementById('budgetIsActive').checked;

                try {
                    if (this.budgetState.editingId) {
                        // PUT update
                        const res = await fetch(`${API_BASE}/budgets/${this.budgetState.editingId}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ amount_limit: amount, period, rollover, is_active: isActive })
                        });
                        const r = await res.json();
                        if (res.ok) { this.closeBudgetModal(); await this.loadBudgetsProgress(); } else alert(r.detail || 'Update failed');
                    } else {
                        // POST create
                        const l1Name = document.getElementById('budgetL1Name').value;
                        const res = await fetch(`${API_BASE}/budgets`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ l1_category_name: l1Name, amount_limit: amount, period, rollover, is_active: isActive })
                        });
                        const r = await res.json();
                        if (res.ok) { this.closeBudgetModal(); await this.loadBudgetsProgress(); } else alert(r.detail || 'Creation failed');
                    }
                } catch (e) { alert(e.message); }
            },
        };

        // Close category dropdowns on outside click
        document.addEventListener('click', e => {
            if (!e.target.closest('.cat-dropdown')) {
                document.getElementById('recCatMenu')?.classList.remove('open');
                document.getElementById('anCatMenu')?.classList.remove('open');
            }
        });

        router.render();
    </script>
</body>
</html>
